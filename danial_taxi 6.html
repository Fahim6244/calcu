<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danial Taxi</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #000;
        }
        .auth-subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .driver-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .driver-btn {
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .driver-btn.active {
            background: #d4af37;
            color: white;
            border-color: #d4af37;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
        }
        .button-group {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-login {
            background: linear-gradient(135deg, #d4af37, #f59e0b);
            color: #000;
            width: 100%;
        }
        .btn-signup {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #d4af37;
            width: 100%;
        }
        .error-msg {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #dc2626;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .dashboard {
            display: none;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .dashboard.active {
            display: block;
        }
        .dash-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dash-title {
            font-size: 32px;
            font-weight: 700;
            color: #000;
        }
        .dash-info {
            color: #666;
            font-size: 14px;
        }
        .btn-logout {
            padding: 10px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <div class="auth-title">🚕 Danial Taxi</div>
            <div class="auth-subtitle">Professional Income Tracker</div>

            <div id="errorMsg" class="error-msg"></div>

            <div class="driver-select">
                <button class="driver-btn active" id="driver1Btn">Driver 1</button>
                <button class="driver-btn" id="driver2Btn">Driver 2</button>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••">
            </div>

            <div class="button-group">
                <button class="btn btn-login" id="loginBtn">Sign In</button>
                <button class="btn btn-signup" id="signupBtn">Create Account</button>
            </div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="dash-header">
            <div>
                <div class="dash-title">Danial Taxi</div>
                <div class="dash-info" id="userInfo">Logged in as Driver 1</div>
            </div>
            <button class="btn-logout" id="logoutBtn">Sign Out</button>
        </div>
        <div id="dashContent">
            <p>Dashboard loading...</p>
        </div>
    </div>

    <script>
        let currentDriver = 'driver1';
        let currentUser = null;
        let auth, db;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBlwF6FfIOXsxBHGF3U_Njp0mVYiOvMMD8",
            authDomain: "danial-taxi.firebaseapp.com",
            projectId: "danial-taxi",
            storageBucket: "danial-taxi.firebasestorage.app",
            messagingSenderId: "785280554352",
            appId: "1:785280554352:web:e5ff30d25488bc4d926bb5"
        };

        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        console.log("✅ Firebase initialized");

        // Driver selection
        document.getElementById('driver1Btn').addEventListener('click', function() {
            currentDriver = 'driver1';
            document.getElementById('driver1Btn').classList.add('active');
            document.getElementById('driver2Btn').classList.remove('active');
            console.log("Selected: Driver 1");
        });

        document.getElementById('driver2Btn').addEventListener('click', function() {
            currentDriver = 'driver2';
            document.getElementById('driver2Btn').classList.add('active');
            document.getElementById('driver1Btn').classList.remove('active');
            console.log("Selected: Driver 2");
        });

        // Sign In
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            console.log("🔐 Attempting login with:", email);

            auth.signInWithEmailAndPassword(email, password)
                .then(result => {
                    console.log("✅ Login successful:", result.user.uid);
                    currentUser = result.user;
                    showDashboard();
                })
                .catch(error => {
                    console.error("❌ Login failed:", error.code, error.message);
                    showError(error.message);
                });
        });

        // Create Account
        document.getElementById('signupBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            console.log("📝 Attempting signup as:", currentDriver);

            auth.createUserWithEmailAndPassword(email, password)
                .then(result => {
                    console.log("✅ Signup successful:", result.user.uid);
                    currentUser = result.user;
                    
                    // Save to Firestore
                    db.collection('users').doc(currentUser.uid).set({
                        email: email,
                        driver: currentDriver,
                        driverName: currentDriver === 'driver1' ? 'Driver 1' : 'Driver 2',
                        created: new Date()
                    }).then(() => {
                        console.log("✅ User data saved to Firestore");
                        showDashboard();
                    }).catch(err => {
                        console.error("❌ Firestore error:", err);
                        showError('Account created but error saving data: ' + err.message);
                    });
                })
                .catch(error => {
                    console.error("❌ Signup failed:", error.code, error.message);
                    showError(error.message);
                });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            auth.signOut().then(() => {
                console.log("✅ Logged out");
                currentUser = null;
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('dashboard').classList.remove('active');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            const driverName = currentDriver === 'driver1' ? 'Driver 1' : 'Driver 2';
            document.getElementById('userInfo').textContent = `Logged in as ${driverName}`;
            document.getElementById('dashContent').innerHTML = `
                <div style="background:white;padding:30px;border-radius:12px;text-align:center;">
                    <h2 style="margin-bottom:20px;color:#000;">Welcome, ${driverName}!</h2>
                    <p style="color:#666;margin-bottom:20px;">Your income tracker is ready. Full features coming soon.</p>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;">
                        <div style="background:linear-gradient(135deg,#d4af37,#f59e0b);color:white;padding:20px;border-radius:12px;">
                            <div style="font-size:12px;opacity:0.9;">Total Cash</div>
                            <div style="font-size:24px;font-weight:700;">€0.00</div>
                        </div>
                        <div style="background:linear-gradient(135deg,#d4af37,#f59e0b);color:white;padding:20px;border-radius:12px;">
                            <div style="font-size:12px;opacity:0.9;">Total Card</div>
                            <div style="font-size:24px;font-weight:700;">€0.00</div>
                        </div>
                        <div style="background:linear-gradient(135deg,#d4af37,#f59e0b);color:white;padding:20px;border-radius:12px;">
                            <div style="font-size:12px;opacity:0.9;">Total Tips</div>
                            <div style="font-size:24px;font-weight:700;">€0.00</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Check auth state on load
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log("✅ User already logged in:", user.uid);
                currentUser = user;
                showDashboard();
            }
        });
    </script>
</body>
</html>
