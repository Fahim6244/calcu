<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Raza Cars</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2236;--bg4:#1f2d47;
  --blue:#3b82f6;--blue2:#2563eb;--green:#10b981;--green2:#059669;
  --red:#ef4444;--orange:#f59e0b;--purple:#8b5cf6;--teal:#14b8a6;
  --gold:#fbbf24;--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
  --border:#1e3a5f;--border2:#334155;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Arial,sans-serif;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
::-webkit-scrollbar{display:none}
input,button,select,textarea{font-family:inherit;-webkit-appearance:none}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
/* Toast */
#toast{position:fixed;top:calc(env(safe-area-inset-top)+16px);left:50%;transform:translateX(-50%);z-index:9999;background:#1e293b;color:white;padding:10px 20px;border-radius:999px;font-size:14px;box-shadow:0 4px 24px rgba(0,0,0,.6);border:1px solid #334155;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
/* Modal */
#modal-bg{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
#modal-bg.show{display:flex}
#modal-box{background:var(--bg3);border-radius:22px 22px 0 0;padding:22px 18px 38px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.m-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.m-title{font-size:17px;font-weight:700;margin-bottom:14px}
/* Auth */
#screen-auth{background:linear-gradient(160deg,#0a0f1e,#0f2040,#0a0f1e);align-items:center;justify-content:center;padding:32px 22px}
.a-logo{font-size:52px;text-align:center;margin-bottom:6px}
.a-title{font-size:26px;font-weight:800;text-align:center;background:linear-gradient(135deg,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px}
.a-sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:28px}
.a-tabs{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px;width:100%}
.a-tab{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:var(--text2)}
.a-tab.on{background:var(--blue2);color:white}
.a-form{width:100%;display:flex;flex-direction:column;gap:10px}
.inp label{display:block;font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.inp input,.inp select{width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:12px;padding:13px 15px;font-size:15px;outline:none}
.inp input:focus,.inp select:focus{border-color:var(--blue)}
.inp select option{background:var(--bg2)}
.btn-main{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;font-size:15px;font-weight:700;margin-top:6px}
.a-sw{text-align:center;font-size:12px;color:var(--text2);margin-top:14px}
.a-sw span{color:var(--blue);cursor:pointer;font-weight:600}
/* Header */
.hdr{background:linear-gradient(135deg,var(--bg2),var(--bg4));padding:14px 14px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.hdr-title{font-size:16px;font-weight:700}
.hdr-sub{font-size:10px;color:var(--text2)}
.badge{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:600}
.badge-o{background:rgba(139,92,246,.2);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
.badge-d{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.btn-exit{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600}
/* Tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{flex:1;min-width:52px;padding:7px 0;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text3);border-bottom:2px solid transparent;font-size:9px;font-weight:600;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab .ic{font-size:15px}
/* Content */
.content{flex:1;overflow-y:auto;padding:10px 13px 30px}
.panel{display:none;flex-direction:column;gap:10px}
.panel.on{display:flex}
/* Cards */
.card{background:var(--bg3);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.ch{padding:7px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.cb{padding:12px;display:flex;flex-direction:column;gap:9px}
.sec{font-size:15px;font-weight:700}
/* Stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--bg3);border-radius:12px;padding:11px;border:1px solid var(--border)}
.sv{font-size:17px;font-weight:800;font-family:monospace;margin-bottom:2px}
.sl{font-size:10px;color:var(--text2)}
/* Rows */
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(51,65,85,.25)}
.row:last-child{border:none}
.rl{font-size:12px;color:var(--text2)}
.rv{font-size:12px;font-family:monospace;font-weight:600;color:var(--text)}
.row.big{border-top:1px solid var(--border2);margin-top:4px;padding-top:7px}
.row.big .rl{font-weight:700;color:var(--text);font-size:13px}
.row.big .rv{font-size:13px}
.row.green .rv{color:var(--green)}.row.red .rv{color:var(--red)}.row.orange .rv{color:var(--orange)}.row.gold .rv{color:var(--gold)}
/* Field */
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fr{display:flex;align-items:center;gap:5px}
.fpre{color:var(--text2);font-weight:700;font-size:15px;flex-shrink:0}
.field input,.field select{flex:1;background:var(--bg4);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field select option{background:var(--bg2)}
.fsuf{color:var(--text2);font-size:12px;flex-shrink:0}
/* Buttons */
.btn{padding:11px;border-radius:11px;font-size:13px;font-weight:700;border:none;color:white;text-align:center;cursor:pointer}
.bb{background:linear-gradient(135deg,var(--blue2),var(--blue))}
.bg{background:linear-gradient(135deg,var(--green2),var(--green))}
.br{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bs{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
.bp{background:linear-gradient(135deg,#7c3aed,var(--purple))}
.bor{background:linear-gradient(135deg,#d97706,var(--orange))}
.brow{display:flex;gap:8px}
.brow .btn{flex:1}
.bfull{width:100%}
.bsm{padding:5px 10px;border-radius:7px;font-size:11px}
/* Driver item */
.di{background:var(--bg3);border-radius:12px;padding:10px 12px;border:1px solid var(--border);display:flex;align-items:center;gap:9px;cursor:pointer}
.dav{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
.din{flex:1;min-width:0}
.dn{font-weight:700;font-size:13px;margin-bottom:1px}
.dm{font-size:10px;color:var(--text2)}
.dst{text-align:right;flex-shrink:0}
.dst .v{font-family:monospace;font-weight:700;font-size:12px}
.dst .l{font-size:10px;color:var(--text2)}
/* Car item */
.ci{background:var(--bg3);border-radius:12px;padding:10px 12px;border:1px solid var(--border)}
.plate{background:linear-gradient(135deg,var(--gold),#f97316);color:#000;font-weight:800;font-size:11px;padding:2px 7px;border-radius:5px;letter-spacing:1px;display:inline-block}
/* Balance */
.bal{border-radius:11px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.bal.owe{background:rgba(20,83,45,.3);border:1px solid rgba(16,185,129,.3)}
.bal.give{background:rgba(120,53,15,.3);border:1px solid rgba(245,158,11,.3)}
.bl{font-size:12px;font-weight:700;margin-bottom:2px}
.bsub{font-size:10px;color:var(--text2)}
.bamt{font-size:20px;font-weight:800;font-family:monospace;flex-shrink:0;margin-left:8px}
/* Progress */
.pt{flex:1;background:rgba(71,85,105,.3);border-radius:999px;height:5px;overflow:hidden}
.pf{height:5px;border-radius:999px;transition:width .5s}
/* Chips */
.chip{display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:600}
.cg{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.cb2{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.co{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.cr{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.cgr{background:rgba(71,85,105,.2);color:var(--text2);border:1px solid var(--border2)}
.cgold{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.3)}
/* Calendar */
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{text-align:center;font-size:9px;color:var(--text3);padding-bottom:3px}
.cday{font-size:11px;padding:5px 0;border-radius:6px;background:rgba(51,65,85,.3);color:var(--text2);border:1px solid transparent;text-align:center;cursor:pointer}
.cday.sel{background:var(--blue2);color:white;transform:scale(1.05)}
.cday.has{background:rgba(16,185,129,.2);color:#34d399;font-weight:700;border-color:rgba(16,185,129,.3)}
.cday.apv{background:rgba(16,185,129,.3);color:#34d399;font-weight:700;border-color:rgba(16,185,129,.5)}
.cday.pend{background:rgba(245,158,11,.2);color:#fcd34d;border-color:rgba(245,158,11,.3)}
.cday.tod{border-color:var(--blue);color:#93c5fd}
.cday.tue{background:rgba(239,68,68,.15);color:#fca5a5}
.cday.lk{opacity:.5;cursor:not-allowed}
.ce{background:transparent;border:none;cursor:default}
/* Form sections */
.fs{background:var(--bg3);border-radius:13px;overflow:hidden;border:1px solid var(--border)}
.fsh{padding:7px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.fsb{padding:12px;display:flex;flex-direction:column;gap:9px}
/* Alerts */
.alert{border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:7px;font-size:11px}
.ai{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
.aw{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.as{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34d399}
.ad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171}
/* Summary driver */
.sd{background:var(--bg3);border-radius:11px;border:1px solid var(--border);overflow:hidden;margin-bottom:6px}
.sdh{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.sdb{padding:0 12px 10px;display:none}
.sdb.on{display:block}
/* Leaderboard */
.lbi{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg3);border-radius:10px;border:1px solid var(--border);margin-bottom:5px}
/* Approve */
.api{background:var(--bg3);border-radius:11px;border:1px solid rgba(245,158,11,.3);padding:10px 12px;margin-bottom:6px}
/* Debt */
.dci{background:var(--bg3);border-radius:11px;border:1px solid var(--border);padding:11px;margin-bottom:6px}
/* Invoice */
.inv{background:white;color:#000;border-radius:10px;padding:13px;font-size:11px;line-height:1.6}
.inv h2{font-size:15px;font-weight:800;color:#1e40af;margin-bottom:3px}
.ir{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:2px 0}
.it{display:flex;justify-content:space-between;font-weight:700;font-size:12px;border-top:2px solid #1e40af;padding-top:4px;margin-top:3px}
/* Loading */
#screen-loading{align-items:center;justify-content:center;gap:10px;background:var(--bg)}
.spin{width:30px;height:30px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.div{height:1px;background:var(--border2);margin:3px 0}
.empty{text-align:center;padding:26px 13px;color:var(--text2)}
.ei{font-size:34px;margin-bottom:7px}
.et{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px}
.es{font-size:11px}
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>
<div id="modal-bg" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div class="m-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Loading -->
<div id="screen-loading" class="screen active">
  <div style="font-size:44px">🚗</div>
  <div class="spin"></div>
  <p style="color:var(--text2);font-size:13px">Raza Cars</p>
</div>

<!-- Auth -->
<div id="screen-auth" class="screen">
  <div class="a-logo">🚗</div>
  <div class="a-title">Raza Cars</div>
  <div class="a-sub">Fleet Earnings Management</div>
  <div class="a-tabs">
    <button class="a-tab on" onclick="authTab('login')">Login</button>
    <button class="a-tab" onclick="authTab('register')">Register</button>
  </div>
  <div class="a-form" id="aform"></div>
  <div class="a-sw" id="asw"></div>
</div>

<!-- Owner -->
<div id="screen-owner" class="screen">
  <div class="hdr">
    <div class="hdr-row">
      <div><div class="hdr-title">🚗 Raza Cars</div><div class="hdr-sub" id="o-sub"></div></div>
      <div style="display:flex;gap:5px;align-items:center">
        <span class="badge badge-o">Owner</span>
        <button class="btn-exit" onclick="logout()">Exit</button>
      </div>
    </div>
  </div>
  <div class="tabs" id="o-tabs"></div>
  <div class="content">
    <div id="op-dash" class="panel on"></div>
    <div id="op-drvs" class="panel"></div>
    <div id="op-cars" class="panel"></div>
    <div id="op-appr" class="panel"></div>
    <div id="op-debt" class="panel"></div>
    <div id="op-rpts" class="panel"></div>
    <div id="op-exps" class="panel"></div>
    <div id="op-sets" class="panel"></div>
  </div>
</div>

<!-- Driver -->
<div id="screen-driver" class="screen">
  <div class="hdr">
    <div class="hdr-row">
      <div><div class="hdr-title" id="d-name">My Earnings</div><div class="hdr-sub" id="d-car"></div></div>
      <div style="display:flex;gap:5px;align-items:center">
        <span class="badge badge-d">Driver</span>
        <button class="btn-exit" onclick="logout()">Exit</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:7px;margin-top:7px">
      <div class="pt"><div class="pf" id="d-prog" style="width:0%;background:linear-gradient(90deg,var(--blue2),var(--green))"></div></div>
      <span id="d-prog-lbl" style="font-size:10px;color:white;font-family:monospace;font-weight:700"></span>
      <span id="d-prog-pct" style="font-size:10px;color:var(--text2)"></span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="dTab('entry')"><span class="ic">📝</span><span>Entry</span></button>
    <button class="tab" onclick="dTab('history')"><span class="ic">📋</span><span>History</span></button>
    <button class="tab" onclick="dTab('summary')"><span class="ic">📊</span><span>Summary</span></button>
    <button class="tab" onclick="dTab('balance')"><span class="ic">💰</span><span>Balance</span></button>
  </div>
  <div class="content">
    <div id="dp-entry" class="panel on"></div>
    <div id="dp-history" class="panel"></div>
    <div id="dp-summary" class="panel"></div>
    <div id="dp-balance" class="panel"></div>
  </div>
</div>
</div>

<script>
// ════════════════════════════════════════════════════
// DATABASE
// ════════════════════════════════════════════════════
var DB_KEY = 'razacars_v3';
var SESS_KEY = 'razacars_sess';
var db = { users:{}, drivers:{}, cars:{}, entries:{}, expenses:{}, advances:{} };
var CU = null; // current user
var CD = null; // current driver record

function dbLoad() {
  try { var d = localStorage.getItem(DB_KEY); if (d) db = JSON.parse(d); } catch(e) {}
  if (!db.advances) db.advances = {};
  if (!db.expenses) db.expenses = {};
}
function dbSave() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ════════════════════════════════════════════════════
// SALARY CALCULATION
// ════════════════════════════════════════════════════
function calcDay(e, type, params) {
  var p = params || {};
  var pT = +e.paidTrans||0, cT = +e.cashTrans||0, uA = +e.uberApp||0;
  var uC = +e.uberCash||0, cC = +e.cardCash||0, ex = +e.expenses||0;
  var tip = +e.tip||0, adj = +e.adjustment||0, rent = +e.carRent||0;
  var transfers = pT + cT;
  var income = transfers + uA;
  var phys = uC + cT;
  var actualCash = phys - cC - ex;
  var totalInHand = phys + tip;
  var salary = 0;
  if (type === 'base_bonus') {
    var base = +p.base||1600, thr = +p.thr||6000, bp = +p.bonusPct||40;
    salary = income <= thr ? base : base + (bp/100)*(income-thr);
  } else if (type === 'uber_pct') {
    var pct = +p.pct||35, ud = +p.uberDeduct||10;
    salary = uA*(1-ud/100)*(pct/100) + transfers*(pct/100);
  } else if (type === 'flat_pct') {
    salary = income * (+p.pct||35) / 100;
  } else if (type === 'custom') {
    var tp = +p.tPct||35, ud2 = +p.uberDeduct||10, up = +p.uPct||35;
    salary = transfers*(tp/100) + uA*(1-ud2/100)*(up/100);
  }
  var salTips = salary + tip;
  var netSal = salTips - rent;
  var bal = (actualCash - netSal) - adj;
  return { pT:pT, cT:cT, uA:uA, uC:uC, cC:cC, ex:ex, tip:tip, adj:adj, rent:rent,
           transfers:transfers, income:income, phys:phys, actualCash:actualCash,
           totalInHand:totalInHand, salary:salary, salTips:salTips, netSal:netSal, bal:bal };
}

function calcMonth(driverId, y, m) {
  var drv = db.drivers[driverId];
  if (!drv) return null;
  var pfx = driverId + '_' + y + '-' + pad(m);
  var t = { pT:0,cT:0,uA:0,uC:0,cC:0,ex:0,tip:0,adj:0,rent:0,income:0,phys:0,actualCash:0,salary:0,bal:0,days:0 };
  Object.keys(db.entries).forEach(function(k) {
    if (k.indexOf(pfx) !== 0) return;
    var e = db.entries[k];
    var c = calcDay(e, drv.salType, drv.salParams);
    t.pT+=c.pT; t.cT+=c.cT; t.uA+=c.uA; t.uC+=c.uC; t.cC+=c.cC; t.ex+=c.ex;
    t.tip+=c.tip; t.adj+=c.adj; t.rent+=c.rent; t.income+=c.income; t.phys+=c.phys;
    t.actualCash+=c.actualCash; t.salary+=c.salary; t.bal+=c.bal; t.days++;
  });
  return t;
}

function getDebt(driverId) {
  var drv = db.drivers[driverId];
  if (!drv) return 0;
  var total = 0;
  Object.keys(db.entries).forEach(function(k) {
    var e = db.entries[k];
    if (e.driverId !== driverId) return;
    total += calcDay(e, drv.salType, drv.salParams).bal;
  });
  Object.keys(db.advances).forEach(function(k) {
    var a = db.advances[k];
    if (a.driverId === driverId && !a.repaid) total += +a.amount||0;
  });
  return total;
}

// ════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════
function f2(n) { return '\u20AC' + Number(n||0).toFixed(2); }
function abs2(n) { return '\u20AC' + Math.abs(Number(n||0)).toFixed(2); }
function pct(a,b) { return b ? (a/b*100).toFixed(0)+'%' : '0%'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n) { return String(n).padStart(2,'0'); }
function today() { var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowY() { return new Date().getFullYear(); }
function nowM() { return new Date().getMonth()+1; }
function nowD() { return new Date().getDate(); }
function dim(y,m) { return new Date(y,m,0).getDate(); }
function dow(y,m,d) { return new Date(y,m-1,d).getDay(); }
function isTue(y,m,d) { return dow(y,m,d)===2; }
function isLocked(dateStr, lockDays) {
  if (!lockDays && lockDays!==0) lockDays=3;
  if (lockDays===0) return false;
  return (new Date()-new Date(dateStr))/(86400000) > lockDays;
}

function doLogin() {
  var email=(document.getElementById('ae').value||'').trim().toLowerCase();
  var pass=document.getElementById('ap').value||'';
  if (!email||!pass) { showToast('⚠️ Fill all fields'); return; }
  var user=null;
  Object.keys(db.users).forEach(function(k){var u=db.users[k];if(u.email===email&&u.pass===pass)user=u;});
  if (!user) { showToast('❌ Wrong email or password'); return; }
  CU=user; afterLogin();
}

function doRegister() {
  var name=(document.getElementById('an').value||'').trim();
  var email=(document.getElementById('ae').value||'').trim().toLowerCase();
  var pass=document.getElementById('ap').value||'';
  var role=document.getElementById('ar').value;
  if (!name||!email||!pass) { showToast('⚠️ Fill all fields'); return; }
  if (pass.length<4) { showToast('⚠️ Password min 4 chars'); return; }
  var exists=false;
  Object.keys(db.users).forEach(function(k){if(db.users[k].email===email)exists=true;});
  if (exists) { showToast('❌ Email already registered'); return; }
  var ownerId=null;
  if (role==='driver') {
    var code=((document.getElementById('oc')||{}).value||'').trim().toUpperCase();
    if (!code) { showToast('⚠️ Enter owner code'); return; }
    var owner=null;
    Object.keys(db.users).forEach(function(k){var u=db.users[k];if(u.role==='owner'&&u.ownerCode===code)owner=u;});
    if (!owner) { showToast('❌ Invalid owner code'); return; }
    ownerId=owner.id;
  }
  var id=uid();
  var ownerCode=role==='owner'?(name.slice(0,3).toUpperCase()+id.slice(-4).toUpperCase()):null;
  db.users[id]={id:id,name:name,email:email,pass:pass,role:role,ownerId:ownerId,ownerCode:ownerCode};
  if (role==='driver') {
    var did=uid();
    db.drivers[did]={id:did,userId:id,name:name,ownerId:ownerId,salType:'flat_pct',salParams:{pct:35},carId:null,active:true,dailyTarget:300,lockDays:3,reqApproval:false,dayOff:2};
  }
  dbSave(); CU=db.users[id]; showToast('✅ Account created!'); afterLogin();
}

function afterLogin() {
  try { localStorage.setItem(SESS_KEY, CU.id); } catch(e) {}
  if (CU.role==='owner') {
    document.getElementById('o-sub').textContent=CU.email;
    buildOwnerTabs(); showScreen('owner'); oSwitch('dash');
  } else {
    var found=null;
    Object.keys(db.drivers).forEach(function(k){var d=db.drivers[k];if(d.userId===CU.id)found=d;});
    if (!found) { showToast('❌ Driver record not found. Contact your manager.'); return; }
    CD=found; showScreen('driver'); renderDrvHeader(); dRender('entry');
  }
}

function logout() {
  try { localStorage.removeItem(SESS_KEY); } catch(e) {}
  CU=null; CD=null; showScreen('auth'); renderAuth();
}

function updSalUI(did,type) { var d=db.drivers[did]; document.getElementById('sal-ui').innerHTML=salUI(type,d?d.salParams:{}); }

function getParams(type) {
  function gv(id){var e=document.getElementById(id);return e?+e.value:0;}
  if(type==='base_bonus')return{base:gv('sp1'),thr:gv('sp2'),bonusPct:gv('sp3')};
  if(type==='uber_pct')return{uberDeduct:gv('sp1'),pct:gv('sp2')};
  if(type==='flat_pct')return{pct:gv('sp1')};
  if(type==='custom')return{tPct:gv('sp1'),uberDeduct:gv('sp2'),uPct:gv('sp3')};
  return{};
}

function setCar(did,carId) {
  var d=db.drivers[did]; if(!d)return;
  if(d.carId&&db.cars[d.carId]){db.cars[d.carId].driverIds=(db.cars[d.carId].driverIds||[]).filter(function(i){return i!==did;});}
  d.carId=carId||null;
  if(carId&&db.cars[carId]){if(!db.cars[carId].driverIds)db.cars[carId].driverIds=[];if(db.cars[carId].driverIds.indexOf(did)<0)db.cars[carId].driverIds.push(did);}
  dbSave();

function renderAppr() {
  var el=document.getElementById('op-appr');
  var pending=[];
  myDrvs().forEach(function(d){
    if(!d.reqApproval)return;
    Object.keys(db.entries).forEach(function(k){
      var e=db.entries[k];
      if(e.driverId===d.id&&e.status==='pending')pending.push({e:e,d:d,key:k});
    });
  });
  pending.sort(function(a,b){return b.e.date.localeCompare(a.e.date);});
  el.innerHTML='<div class="sec">Pending Approvals ('+pending.length+')</div>'+
    pending.map(function(item){

        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'+
        '<div><div style="font-weight:700;font-size:12px">👤 '+esc(drvName(item.d))+'</div>'+

        '<div style="text-align:right"><div style="font-family:monospace;font-weight:700;color:var(--green)">'+f2(c.income)+'</div>'+
        '<span class="chip co">⏳ Pending</span></div></div>'+
        rowH('Paid Trans',f2(c.pT))+rowH('Cash Trans',f2(c.cT))+rowH('Uber App',f2(c.uA))+
        rowH('Expenses',f2(c.ex),'red')+rowH('Salary',f2(c.salary))+
        '<div style="display:flex;gap:7px;margin-top:7px">'+
        '<button class="btn bg bsm" style="flex:1" onclick="approv(\''+item.key+'\')">✅ Approve</button>'+

    carPL.map(function(r){
      return '<div style="background:var(--bg4);border-radius:8px;padding:8px;margin-bottom:5px">'+

function chgRm(d){rM+=d;if(rM>12){rM=1;rY++;}if(rM<1){rM=12;rY--;}renderRpts();}
function shareReport(){
  var drivers=myDrvs(); var msg='📊 FLEET REPORT — '+MN[rM-1]+' '+rY+'\n🚗 Raza Cars\n━━━━━━━━━━━━\n';
  var total=0;
  drivers.forEach(function(d){var t=calcMonth(d.id,rY,rM);if(t&&t.days>0){msg+='👤 '+drvName(d)+': '+f2(t.income)+' ('+t.days+' days)\n';total+=t.income;}});
  msg+='━━━━━━━━━━━━\n🏁 TOTAL: '+f2(total);
  window.open('https://wa.me/?text='+encodeURIComponent(msg));
}
function exportCSV(){
  var drivers=myDrvs(); var csv='Driver,Date,Paid,Cash,Uber,Total,Expenses,Salary,Balance,Status\n';
  var pfx=rY+'-'+pad(rM);
  drivers.forEach(function(d){
    var name=drvName(d);
    Object.keys(db.entries).forEach(function(k){
      if(k.indexOf(d.id+'_'+pfx)!==0)return;
      var e=db.entries[k]; var c=calcDay(e,d.salType,d.salParams);
      csv+='"'+name+'",'+e.date+','+c.pT+','+c.cT+','+c.uA+','+c.income+','+c.ex+','+c.salary.toFixed(2)+','+c.bal.toFixed(2)+','+(e.status||'saved')+'\n';
    });
  });
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='RazaCars_'+rY+'_'+rM+'.csv'; a.click(); URL.revokeObjectURL(url);
  showToast('📥 CSV exported!');
}

// Check if a date is the driver's day off
function isDayOff(dateStr, driverDayOff) {
  if(driverDayOff === undefined || driverDayOff === null) driverDayOff = 2; // default Tuesday
  if(driverDayOff === -1) return false; // no day off
  var parts = dateStr.split('-');
  var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
  return d.getDay() === driverDayOff;
}
var DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  var c=calcDay(dEntry,CD.salType,CD.salParams);
  var parts=dSelDate.split('-'); var sY=+parts[0],sM=+parts[1],sD=+parts[2];
  var isToday=dSelDate===today();
  var driverDayOff = CD.dayOff !== undefined ? CD.dayOff : 2;
  var isTueDay=isDayOff(dSelDate, driverDayOff);
  var locked=isLocked(dSelDate,CD.lockDays);
  var status=saved?saved.status:'';
  var target=CD.dailyTarget||300;
  var prog=Math.min(100,(c.income/target)*100);

    var ds=y+'-'+pad(m)+'-'+pad(d2);
    var isSel=ds===dSelDate;
    var e=db.entries[CD.id+'_'+ds];
    var isTod=d2===nowD()&&sM===m&&sY===y;
    var isTd=isDayOff(ds, CD.dayOff !== undefined ? CD.dayOff : 2);
    var lk=isLocked(ds,CD.lockDays);

    if(isSel)cls+=' sel';
    else if(e&&e.status==='approved')cls+=' apv';
    else if(e&&e.status==='pending')cls+=' pend';
    else if(e)cls+=' has';
    else if(isTod)cls+=' tod';
    else if(isTd)cls+=' tue';
    if(lk&&!isSel)cls+=' lk';
    calHTML+='<button class="'+cls+'" onclick="selDate(\''+ds+'\')">'+d2+'</button>';
  }
  calHTML+='</div>';

  var statusChips='';

  else if(status==='pending')statusChips='<span class="chip co">⏳ Pending</span>';
  else if(status==='rejected')statusChips='<span class="chip cr">❌ Rejected</span>';
  else if(saved)statusChips='<span class="chip cb2">💾 Saved</span>';
  if(locked)statusChips+=' <span class="chip cgr">🔒 Locked</span>';

  var html='<div class="card"><div class="cb">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">'+
    '<div><div style="font-weight:700;font-size:14px">'+dSelDate+'</div>'+
    '<div style="font-size:10px;color:var(--text2)">'+DOW[dow(sY,sM,sD)]+(isToday?' · Today':'')+(isTueDay?' · 🔴 '+DAY_NAMES[driverDayOff]+' (Day Off)':'')+(locked?' · 🔒 Locked':'')+'</div></div>'+
    '<div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end">'+statusChips+'</div></div>'+
    calHTML+
    '<div style="display:flex;gap:7px;justify-content:center;margin-top:5px;font-size:9px;color:var(--text3)">'+
    '<span style="color:#34d399">● Saved</span><span style="color:#93c5fd">◌ Today</span>'+
    '<span style="color:#fca5a5">● Tue</span><span style="color:#fcd34d">● Pending</span></div>'+
    '</div></div>';

  if(locked)html+='<div class="alert aw">🔒 Entry locked. Contact your manager to edit.</div>';
  if(status==='rejected')html+='<div class="alert ad">❌ Rejected by owner. Please correct and resubmit.</div>';

  if(!locked){
    // Daily target progress
    html+='<div class="card"><div class="cb">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'+
      '<span style="font-size:11px;color:var(--text2)">🎯 Daily Target: '+f2(target)+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:'+(c.income>=target?'var(--green)':'var(--text2)')+'">'+f2(c.income)+' / '+f2(target)+'</span></div>'+
      '<div class="pt"><div class="pf" style="width:'+prog+'%;background:'+(prog>=100?'linear-gradient(90deg,var(--green2),var(--green))':'linear-gradient(90deg,var(--blue2),var(--blue))')+'"></div></div>'+
      (c.income>=target?'<div style="font-size:10px;color:var(--green);margin-top:3px;font-weight:700">🎉 Daily target reached!</div>':'')+
      '</div></div>';
    // Income
    html+='<div class="fs"><div class="fsh" style="background:rgba(37,99,235,.2);color:#93c5fd">💵 Income</div><div class="fsb">'+
      dF('paidTrans','Paid Transfers','🏢',dEntry.paidTrans)+
      dF('cashTrans','Cash Transfers','💵',dEntry.cashTrans)+
      dF('uberApp','Uber App','🚗',dEntry.uberApp)+
      (c.income>0?'<div style="background:rgba(15,23,42,.5);border-radius:9px;padding:9px;border:1px solid var(--border)">'+
      '<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#60a5fa;margin-bottom:5px">Income Breakdown</div>'+
      (c.pT>0?rowH('🏢 Paid',f2(c.pT)):'')+
      (c.cT>0?rowH('💵 Cash Trans',f2(c.cT)):'')+
      (c.uA>0?rowH('🚗 Uber App',f2(c.uA)):'')+
      rowH('Total Income',f2(c.income),'green big')+'</div>':'')+
      '</div></div>';
    // Cash
    html+='<div class="fs"><div class="fsh" style="background:rgba(16,185,129,.2);color:#34d399">💰 Cash & Expenses</div><div class="fsb">'+
      dF('uberCash','Uber Cash (in hand)','💶',dEntry.uberCash)+
      dF('cardCash','Card Cash (→ Company)','💳',dEntry.cardCash)+
      dF('expenses','Fuel / Petrol / Wash','⛽',dEntry.expenses)+
      dF('tip','Tip (yours to keep)','🎁',dEntry.tip||'')+
      dF('carRent','Car Rent / Lease','🏢',dEntry.carRent||'')+
      '</div></div>';
    // Notes
    html+='<div class="fs"><div class="fsh" style="background:rgba(51,65,85,.5);color:var(--text2)">📝 Notes & KM</div><div class="fsb">'+
      '<div class="field"><label>Notes</label><input type="text" value="'+esc(dEntry.notes||'')+'" onchange="dC(\'notes\',this.value)" placeholder="Notes..."></div>'+
      '<div class="field"><label>KM Driven</label><div class="fr"><input type="number" inputmode="decimal" value="'+esc(dEntry.km||'')+'" onchange="dC(\'km\',this.value)" placeholder="0"><span class="fsuf">km</span></div></div>'+
      '</div></div>';
    // Adjustment
    html+='<div class="fs"><div class="fsh" style="background:rgba(109,40,217,.2);color:#a78bfa">⚖️ Adjustment / Advance</div><div class="fsb">'+
      '<p style="font-size:10px;color:var(--text2)">Advance taken = <span style="color:var(--red)">+positive</span>. Extra owed to you = <span style="color:var(--green)">-negative</span>.</p>'+
      dF('adjustment','Advance / Adjustment','⚖️',dEntry.adjustment||'')+
      '</div></div>';

    html+='<div class="fs"><div class="fsh" style="background:rgba(67,56,202,.3);color:#c7d2fe">📊 Auto-Calculated</div><div class="fsb" id="d-calc">'+dCalc(c)+'</div></div>';

  }

function dF(id,label,emoji,val) {
  return '<div class="field"><label>'+emoji+' '+label+'</label><div class="fr"><span class="fpre">€</span>'+

function dCalc(c) {
  var isPos=c.bal<0;
  return rowH('Total Income',f2(c.income),'green big')+
    rowH('Your Salary',f2(c.salary))+
    (c.tip>0?rowH('🎁 Tips (yours)','+'+f2(c.tip),'green'):'')+
    (c.carRent>0?rowH('🏢 Car Rent','-'+f2(c.rent),'red'):'')+
    rowH('Net Salary',f2(c.netSal),'big')+
    '<div class="div"></div>'+
    rowH('Cash in Hand',f2(c.phys))+
    (c.cC>0?rowH('Less: Card Cash','-'+f2(c.cC),'red'):'')+
    (c.ex>0?rowH('Less: Expenses','-'+f2(c.ex),'red'):'')+
    rowH('Actual Cash',f2(c.actualCash),'big')+
    (c.adj!==0?rowH(c.adj>0?'Less: Advance':'Plus: Extra',c.adj>0?'-'+f2(c.adj):'+'+f2(Math.abs(c.adj)),'orange'):'')+
    '<div class="bal '+(isPos?'owe':'give')+'" style="margin-top:9px">'+
    '<div><div class="bl" style="color:'+(isPos?'#34d399':'#fb923c')+'">'+(isPos?'✅ Company owes you':'⚠️ You owe company')+'</div>'+
    '<div class="bsub">Cash '+f2(c.actualCash)+' vs Salary '+f2(c.netSal)+'</div></div>'+
    '<div class="bamt" style="color:'+(isPos?'#34d399':'#fb923c')+'">'+abs2(c.bal)+'</div></div>';
}

function dC(field,val) {
  dEntry[field]=val;
  var c=calcDay(dEntry,CD.salType,CD.salParams);
  var el=document.getElementById('d-calc');
  if(el)el.innerHTML=dCalc(c);
}

function selDate(date) {
  dSelDate=date;
  var key=CD.id+'_'+date;
  var saved=db.entries[key];
  if(saved){Object.keys(BLANK).forEach(function(k){dEntry[k]=saved[k]!==undefined?saved[k]:BLANK[k];});}
  else{Object.keys(BLANK).forEach(function(k){dEntry[k]=BLANK[k];});}
  renderEntry();
}

function saveEntry() {
  if(isLocked(dSelDate,CD.lockDays)){showToast('🔒 Entry locked');return;}
  var key=CD.id+'_'+dSelDate;
  var status=CD.reqApproval?'pending':'approved';
  var entry={driverId:CD.id,date:dSelDate,status:status,savedAt:new Date().toISOString()};
  Object.keys(BLANK).forEach(function(k){entry[k]=dEntry[k];});
  db.entries[key]=entry;
  dbSave(); showToast(CD.reqApproval?'✅ Saved — waiting approval':'✅ Saved!');
  renderDrvHeader(); renderEntry();
}

function clearEntry() {
  if(isLocked(dSelDate,CD.lockDays)){showToast('🔒 Entry locked');return;}
  var key=CD.id+'_'+dSelDate;
  delete db.entries[key];
  Object.keys(BLANK).forEach(function(k){dEntry[k]=BLANK[k];});
  dbSave(); showToast('🗑 Cleared'); renderEntry();
}

function shareDay() {
  var c=calcDay(dEntry,CD.salType,CD.salParams);

}

function renderHistory() {
  var el=document.getElementById('dp-history');
  var entries=Object.keys(db.entries).map(function(k){return db.entries[k];}).filter(function(e){return e.driverId===CD.id;}).sort(function(a,b){return b.date.localeCompare(a.date);});
  el.innerHTML='<div class="sec">My Entries ('+entries.length+')</div>'+
    (entries.length?entries.map(function(e){
      var c=calcDay(e,CD.salType,CD.salParams);
      var parts=e.date.split('-'); var d=new Date(+parts[0],+parts[1]-1,+parts[2]);
      var sc=e.status==='approved'?'<span class="chip cg">✅</span>':e.status==='pending'?'<span class="chip co">⏳</span>':e.status==='rejected'?'<span class="chip cr">❌</span>':'';
      return '<div class="di" onclick="selDate(\''+e.date+'\');dTab(\'entry\')">'+
        '<div class="dav" style="background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93c5fd;font-size:12px;font-weight:700">'+parts[2]+'</div>'+
        '<div class="din"><div class="dn">'+e.date+' '+sc+'</div><div class="dm">'+DOW[d.getDay()]+' · '+f2(c.totalInHand)+' in hand</div></div>'+
        '<div class="dst"><div class="v" style="color:var(--green)">'+f2(c.income)+'</div>'+
        '<div class="l" style="color:'+(c.bal<0?'#34d399':'#fb923c')+'">'+(c.bal<0?'Co.'+abs2(c.bal):'Owe '+abs2(c.bal))+'</div></div></div>';
    }).join(''):'<div class="empty"><div class="ei">📋</div><div class="et">No entries yet</div><div class="es">Start adding your daily data</div></div>');
}

// ════════════════════════════════════════════════════
// DRIVER — SUMMARY
// ════════════════════════════════════════════════════
var svY=nowY(), svM=nowM();
function renderSummary() {
  var el=document.getElementById('dp-summary');
  var t=calcMonth(CD.id,svY,svM);
  var mBal=t?t.bal:0;
  var target=(CD.dailyTarget||300)*dim(svY,svM);
  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between">'+
    '<div class="sec">My Summary</div>'+
    '<div style="display:flex;gap:5px">'+
    '<button onclick="chgSvm(-1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px">‹</button>'+
    '<button onclick="chgSvm(1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px">›</button></div></div>'+
    '<div style="font-size:11px;color:var(--text2)">'+MN[svM-1]+' '+svY+'</div>'+
    (t&&t.days>0?
    '<div class="sg">'+
    '<div class="sc"><div class="sv" style="color:var(--green)">'+f2(t.income)+'</div><div class="sl">Total Income</div></div>'+
    '<div class="sc"><div class="sv" style="color:var(--blue)">'+f2(t.salary)+'</div><div class="sl">Your Salary</div></div>'+
    '<div class="sc"><div class="sv" style="color:var(--gold)">'+t.days+'</div><div class="sl">Working Days</div></div>'+
    '<div class="sc"><div class="sv" style="color:var(--teal)">'+f2(t.days>0?t.income/t.days:0)+'</div><div class="sl">Avg / Day</div></div>'+
    '</div>'+
    '<div class="card"><div class="cb">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'+
    '<span style="font-size:11px;color:var(--text2)">🎯 Monthly Target: '+f2(target)+'</span>'+
    '<span style="font-size:11px;font-weight:700;color:'+(t.income>=target?'var(--green)':'var(--text2)')+'">'+pct(t.income,target)+'</span></div>'+
    '<div class="pt"><div class="pf" style="width:'+Math.min(100,(t.income/target)*100)+'%;background:'+(t.income>=target?'linear-gradient(90deg,var(--green2),var(--green))':'linear-gradient(90deg,var(--blue2),var(--blue))')+'"></div></div>'+
    (t.income>=target?'<div style="font-size:10px;color:var(--green);margin-top:3px;font-weight:700">🎉 Monthly target reached!</div>':'')+
    '</div></div>'+
    '<div class="card"><div class="ch" style="color:#93c5fd">Income</div><div class="cb">'+
    rowH('🏢 Paid',f2(t.pT))+rowH('💵 Cash Trans',f2(t.cT))+rowH('🚗 Uber App',f2(t.uA))+rowH('Total',f2(t.income),'green big')+
    '</div></div>'+
    '<div class="card"><div class="ch" style="color:#34d399">Cash Flow</div><div class="cb">'+
    rowH('Physical Cash',f2(t.phys))+rowH('Less: Card Cash','-'+f2(t.cC),'red')+rowH('Less: Expenses','-'+f2(t.ex),'red')+rowH('Actual Cash',f2(t.actualCash),'big')+
    '</div></div>'+
    '<div class="card"><div class="ch" style="color:#a78bfa">Salary</div><div class="cb">'+
    rowH('Salary',f2(t.salary))+(t.tip>0?rowH('🎁 Tips','+'+f2(t.tip),'green'):'')+(t.rent>0?rowH('🏢 Car Rent','-'+f2(t.rent),'red'):'')+
    '</div></div>'+
    '<div class="bal '+(mBal<0?'owe':'give')+'"><div><div class="bl" style="color:'+(mBal<0?'#34d399':'#fb923c')+'">'+(mBal<0?'✅ Company owes you':'⚠️ You owe company')+'</div><div class="bsub">Month balance</div></div><div class="bamt" style="color:'+(mBal<0?'#34d399':'#fb923c')+'">'+abs2(mBal)+'</div></div>'+
    '<button class="btn bg bfull" onclick="shareMonth()">📱 Share Monthly Summary</button>'
    :'<div class="empty"><div class="ei">📊</div><div class="et">No data this month</div></div>');
}
function chgSvm(d){svM+=d;if(svM>12){svM=1;svY++;}if(svM<1){svM=12;svY--;}renderSummary();}
function shareMonth(){
  var t=calcMonth(CD.id,svY,svM); if(!t)return;
  var debt=getDebt(CD.id);
  var msg='📊 MONTHLY — '+MN[svM-1]+' '+svY+'\n🚗 Raza Cars\n━━━━━━━━━━━━\nTotal Income: '+f2(t.income)+'\n↳ Paid: '+f2(t.pT)+'\n↳ Cash: '+f2(t.cT)+'\n↳ Uber: '+f2(t.uA)+'\n────────────\nSalary: '+f2(t.salary)+'\nActual Cash: '+f2(t.actualCash)+'\nDays: '+t.days+' · Avg: '+f2(t.days>0?t.income/t.days:0)+'\n────────────\nMonth: '+(t.bal<0?'✅ Co.owes: '+abs2(t.bal):'⚠️ You owe: '+abs2(t.bal))+'\nRunning: '+(debt<0?'✅ Co.owes: '+abs2(debt):'⚠️ You owe: '+abs2(debt));
  window.open('https://wa.me/?text='+encodeURIComponent(msg));
}

// ════════════════════════════════════════════════════
// DRIVER — BALANCE
// ════════════════════════════════════════════════════
function renderBalance() {
  var el=document.getElementById('dp-balance');
  var debt=getDebt(CD.id);
  var myAdv=Object.keys(db.advances).map(function(k){return db.advances[k];}).filter(function(a){return a.driverId===CD.id;});
  var y=nowY(), m=nowM();
  var monthRows=[];
  for(var i=0;i<6;i++){
    var mm=m-i, yy=y;
    if(mm<1){mm+=12;yy--;}
    var t=calcMonth(CD.id,yy,mm);
    if(t&&t.days>0)monthRows.push({label:MNS[mm-1]+' '+yy,bal:t.bal,days:t.days,inc:t.income});
  }
  el.innerHTML='<div class="sec">My Balance</div>'+
    '<div class="bal '+(debt<0?'owe':'give')+'">'+
    '<div><div class="bl" style="color:'+(debt<0?'#34d399':'#fb923c')+';font-size:14px">'+(debt<0?'✅ Company owes you':'⚠️ You owe company')+'</div>'+
    '<div class="bsub">All months combined + advances</div></div>'+
    '<div class="bamt" style="color:'+(debt<0?'#34d399':'#fb923c')+';font-size:24px">'+abs2(debt)+'</div></div>'+
    '<div class="alert ai">💡 Running total — all months including any advances received</div>'+
    (myAdv.length?'<div class="card"><div class="ch" style="color:var(--orange)">💸 Advances / Loans</div><div class="cb">'+
    myAdv.map(function(a){return '<div class="row"><div><div style="font-size:11px">'+esc(a.note||'Advance')+'</div>'+
      '<div style="font-size:9px;color:var(--text2)">'+a.date+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:5px"><span class="rv" style="color:'+(a.repaid?'var(--text3)':'var(--orange)')+'">'+f2(a.amount)+'</span>'+
      (a.repaid?'<span class="chip cg">Repaid</span>':'<span class="chip co">Owed</span>')+'</div></div>';}).join('')+
    '</div></div>':'')+
    '<div class="card"><div class="ch" style="color:var(--blue)">📅 Month by Month</div><div class="cb">'+
    (monthRows.length?monthRows.map(function(r){
      return '<div class="row"><span class="rl">'+r.label+' ('+r.days+' days)</span>'+
        '<div style="text-align:right"><div class="rv" style="color:var(--green)">'+f2(r.inc)+'</div>'+
        '<div style="font-size:9px;color:'+(r.bal<0?'#34d399':'#fb923c')+'">'+(r.bal<0?'Co.owes '+abs2(r.bal):'You owe '+abs2(r.bal))+'</div></div></div>';
    }).join(''):'<div style="color:var(--text3);font-size:11px">No data yet</div>')+
    '</div></div>';
}

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
function init() {
  dbLoad();
  renderAuth();
  try {
    var sess=localStorage.getItem(SESS_KEY);
    if(sess&&db.users[sess]){CU=db.users[sess];afterLogin();return;}
  } catch(e) {}
  showScreen('auth');
}

// Init on load
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
