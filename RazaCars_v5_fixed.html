<script>
// Force fresh load — kills browser cache on every visit
(function(){
  const key='rc_ver';
  const ver='v21';;
  if(sessionStorage.getItem(key)!==ver){
    sessionStorage.setItem(key,ver);
    // Add cache-busting param and reload if not already there
    const url=new URL(window.location.href);
    if(!url.searchParams.get('_rc')){
      url.searchParams.set('_rc',Date.now());
      window.location.replace(url.toString());
    }
  }
})();
</script>

const FB={apiKey:"AIzaSyAPqe6KnPoRAaPIRijsWDV-DIbhGHroFg0",authDomain:"raza-cars.firebaseapp.com",projectId:"raza-cars",storageBucket:"raza-cars.firebasestorage.app",messagingSenderId:"907101131064",appId:"1:907101131064:web:3740d8f3ec3297bf24f1cd"};
const fbApp=initializeApp(FB);const auth=getAuth(fbApp);const db=getFirestore(fbApp);

function calcDay(e,type,params){
  const p=params||{};

  let salary=0;
  if(type==='base_bonus'){const base=+p.base||1600,thr=+p.thr||6000,bp=+p.bonusPct||40;salary=income<=thr?base:base+(bp/100)*(income-thr);}
  else if(type==='uber_pct'){const pct=+p.pct||35,ud=+p.uberDeduct||10;salary=uA*(1-ud/100)*(pct/100)+transfers*(pct/100);}
  else if(type==='flat_pct'){salary=income*(+p.pct||35)/100;}
  else if(type==='custom'){salary=transfers*(+p.tPct||35)/100+uA*(1-(+p.uberDeduct||10)/100)*((+p.uPct||35)/100);}
  // netSal = salary + tips - legacy rent + driverExp (owner owes back to driver)
  const salTips=salary+tip,netSal=salTips-rent+driverExp,bal=(actualCash-netSal)-adj;
  return{pT,cT,uA,uC,cC,tip,adj,rent,driverExp,transfers,income,phys,actualCash,totalInHand,salary,salTips,netSal,bal};
}

async function calcMonth(drv,y,m){
  const ym=`${y}-${pad(m)}`;
  const q=query(collection(db,'entries'),where('driverId','==',drv.id),where('yearMonth','==',ym));
  const s=await getDocs(q);
  if(s.empty)return{pT:0,cT:0,uA:0,uC:0,cC:0,tip:0,adj:0,rent:0,driverExp:0,income:0,phys:0,actualCash:0,totalInHand:0,salary:0,netSal:0,bal:0,days:0};

  // Accumulate raw fields first (not salary — salary depends on type)
  let t={pT:0,cT:0,uA:0,uC:0,cC:0,tip:0,adj:0,rent:0,driverExp:0,income:0,phys:0,actualCash:0,totalInHand:0,salary:0,netSal:0,bal:0,days:0};
  s.docs.forEach(d=>{
    const e=d.data();
    t.pT+=+e.paidTrans||0; t.cT+=+e.cashTrans||0; t.uA+=+e.uberApp||0;
    t.uC+=+e.uberCash||0;  t.cC+=+e.cardCash||0;  t.tip+=+e.tip||0;
    t.adj+=+e.adjustment||0; t.rent+=+e.carRent||0;
    t.driverExp+=(+e.driverExp||0)+(+e.cashFuel||0)+(+e.expenses||0);
    t.days++;
  });
  t.income=t.pT+t.cT+t.uA;
  t.phys=t.uC+t.cT;
  t.actualCash=t.phys-t.cC;
  t.totalInHand=t.phys; // tips not in hand — go to company Uber account

  // Calculate salary ONCE on monthly totals (correct for base_bonus)
  const p=drv.salParams||{};
  if(drv.salType==='base_bonus'){
    const base=+p.base||1600,thr=+p.thr||6000,bp=+p.bonusPct||40;
    t.salary=t.income<=thr?base:base+(bp/100)*(t.income-thr);
  }else if(drv.salType==='uber_pct'){
    const pct=+p.pct||35,ud=+p.uberDeduct||10;
    t.salary=t.uA*(1-ud/100)*(pct/100)+(t.pT+t.cT)*(pct/100);
  }else if(drv.salType==='flat_pct'){
    t.salary=t.income*(+p.pct||35)/100;
  }else if(drv.salType==='custom'){
    t.salary=(t.pT+t.cT)*(+p.tPct||35)/100+t.uA*(1-(+p.uberDeduct||10)/100)*((+p.uPct||35)/100);
  }

  t.netSal=t.salary+t.tip-t.rent+t.driverExp;
  t.bal=(t.actualCash-t.netSal)-t.adj;
  return t;
}

async function getDebt(drv,salaryMode=false){
  // Get all distinct yearMonths this driver has entries for
  const eq=query(collection(db,'entries'),where('driverId','==',drv.id));
  const es=await getDocs(eq);
  const months=new Set();
  es.docs.forEach(d=>{const ym=d.data().yearMonth;if(ym)months.add(ym);});
  // Also derive from date if yearMonth missing
  es.docs.forEach(d=>{const dt=d.data().date;if(!d.data().yearMonth&&dt)months.add(dt.slice(0,7));});
  // Months that have been settled (marked or confirmed) are considered paid — exclude from running balance
  const settledMonths=new Set();
  try{const sq=query(collection(db,'settlements'),where('driverId','==',drv.id));const ss=await getDocs(sq);ss.docs.forEach(d=>{const ym=d.data().yearMonth;if(ym)settledMonths.add(ym);});}catch(e){console.warn('getDebt settlements:',e.message);}
  // Sum balance across UNSETTLED months only (correct salary per month)
  const currentYM=`${nowY()}-${pad(nowM())}`;
  let total=0;
  for(const ym of months){
    if(settledMonths.has(ym))continue;
    const [yStr,mStr]=ym.split('-');
    const t=await calcMonth(drv,+yStr,+mStr);
    // salaryMode: current month shows full salary owed (not net-of-cash).
    // Previous unsettled months always carry their real net (actual balance).
    if(salaryMode&&ym===currentYM&&t.bal<0&&t.actualCash<t.netSal){total+=-t.netSal;}
    else{total+=t.bal;}
  }
  // Add unpaid advances
  const aq=query(collection(db,'advances'),where('driverId','==',drv.id),where('repaid','==',false));
  const as=await getDocs(aq);as.docs.forEach(d=>total+=+d.data().amount||0);
  return total;
}

/* ===== MONTH-END SETTLEMENT ENGINE =====
   One settlement doc per driver per month, id = `${driverId}_${yearMonth}`.
   Whoever taps first = initiator (status:'pending', balance shown immediately, no waiting).
   The other side taps Confirm -> status:'confirmed'. Either side can Undo while pending;
   only the owner can Reopen once confirmed. */
const setId=(did,ym)=>`${did}_${ym}`;
const sFmtD=t=>{if(!t)return'';const d=new Date(t);return `${MNS[d.getMonth()]} ${d.getDate()}`;};
async function getSettlement(did,ym){try{const s=await getDoc(doc(db,'settlements',setId(did,ym)));return s.exists()?{id:s.id,...s.data()}:null;}catch(e){console.warn('getSettlement:',e.message);return null;}}
// Fetch all settlements for one driver, keyed by yearMonth (single read, no index needed)
async function getDriverSettlements(did){try{const q=query(collection(db,'settlements'),where('driverId','==',did));const s=await getDocs(q);const m={};s.docs.forEach(d=>m[d.data().yearMonth]={id:d.id,...d.data()});return m;}catch(e){console.warn('getDriverSettlements:',e.message);return{};}}

// Shared renderer: returns the settlement zone HTML for a given month.
// s = settlement doc (or null), bal = signed month balance (<0 company owes, >0 driver owes), viewer = 'driver'|'owner'
function settleZoneHTML(s,did,ym,viewer,bal){
  const other=viewer==='driver'?'owner':'driver';
  const cap=r=>r==='owner'?'Owner':'Driver';
  const emo=r=>r==='owner'?'🏢':'🚗';
  const dirTxt=(dir,amt)=>`${dir==='company_owes'?'Company owed':'Driver owed'} ${f2(amt)}`;
  const bsig=+bal||0;
  // No settlement yet -> show "Mark as settled" button
  if(!s){
    return `<button class="btn bg2 bfull bsm" style="margin-top:8px" onclick="settleMonth('${did}','${ym}','${viewer}',${bsig.toFixed(2)})">🤝 Mark this month settled</button>
      <div style="font-size:9px;color:var(--text3);text-align:center;margin-top:4px">Tap when ${viewer==='driver'?'your salary / balance has been paid out':'you have paid out the driver'} — the ${other} confirms</div>`;
  }
  // Confirmed -> locked badge (owner can reopen)
  if(s.status==='confirmed'){
    return `<div class="alert as2" style="margin-top:8px">✅ Settled &amp; confirmed by ${cap(s.confirmedBy)}${s.confirmedAt?' · '+sFmtD(s.confirmedAt):''} · <strong>${dirTxt(s.direction,s.amount)}</strong></div>
      ${viewer==='owner'?`<button onclick="unsettleMonth('${did}','${ym}','owner')" style="width:100%;padding:5px;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;margin-top:2px">↩ Reopen settlement</button>`:''}`;
  }
  // Pending, this viewer started it -> waiting on the other side
  if(s.initiatedBy===viewer){
    return `<div class="alert as2" style="margin-top:8px">✅ You marked this settled · ⏳ waiting for ${other} to confirm · <strong>${dirTxt(s.direction,s.amount)}</strong></div>
      <button onclick="unsettleMonth('${did}','${ym}','${viewer}')" style="width:100%;padding:5px;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;margin-top:2px">↩ Undo mark</button>`;
  }
  // Pending, the OTHER side started it -> this viewer must confirm
  return `<div class="alert aw" style="margin-top:8px">${emo(s.initiatedBy)} ${cap(s.initiatedBy)} marked this month settled · <strong>${dirTxt(s.direction,s.amount)}</strong></div>
    <button class="btn bg2 bfull bsm" style="margin-top:6px" onclick="confirmSettle('${did}','${ym}','${viewer}')">✓ Confirm settlement</button>`;
}

// Refresh whichever screen the actor is on after a settlement change
function settleRefresh(viewer){if(viewer==='driver'){renderBal().catch(()=>{});}else{renderOwnerHist().catch(()=>{});renderDebt().catch(()=>{});}}

window.settleMonth=async(did,ym,viewer,bal)=>{
  try{
    const ownerId=viewer==='owner'?CU.uid:(CD&&CD.ownerId)||'';
    const driverId=viewer==='driver'?CD.id:did;
    const b=+bal||0;const amount=Math.abs(b);const direction=b<0?'company_owes':'driver_owes';
    await setDoc(doc(db,'settlements',setId(driverId,ym)),{driverId,ownerId,yearMonth:ym,amount,direction,initiatedBy:viewer,initiatedAt:new Date().toISOString(),confirmedBy:null,confirmedAt:null,status:'pending'});
    showToast(viewer==='driver'?'Marked settled — owner will confirm':'Marked settled — driver will confirm');
    settleRefresh(viewer);
  }catch(e){showToast('Error: '+e.message);console.error('settleMonth:',e);}
};

window.confirmSettle=async(did,ym,viewer)=>{
  try{
    const driverId=viewer==='driver'?CD.id:did;
    const ref=doc(db,'settlements',setId(driverId,ym));
    const snap=await getDoc(ref);
    if(!snap.exists()){showToast('Settlement no longer exists');settleRefresh(viewer);return;}
    const s=snap.data();
    if(s.status==='confirmed'){showToast('Already confirmed');settleRefresh(viewer);return;}
    if(s.initiatedBy===viewer){showToast('You started this — the other side confirms it');return;}
    await updateDoc(ref,{confirmedBy:viewer,confirmedAt:new Date().toISOString(),status:'confirmed'});
    showToast('✅ Settlement confirmed');
    settleRefresh(viewer);
  }catch(e){showToast('Error: '+e.message);console.error('confirmSettle:',e);}
};

window.unsettleMonth=async(did,ym,viewer)=>{
  try{
    const driverId=viewer==='driver'?CD.id:did;
    const ref=doc(db,'settlements',setId(driverId,ym));
    const snap=await getDoc(ref);
    if(!snap.exists()){settleRefresh(viewer);return;}
    const s=snap.data();
    if(s.status==='confirmed'&&viewer!=='owner'){showToast('Already confirmed — ask owner to reopen');return;}
    if(!confirm(s.status==='confirmed'?'Reopen this confirmed settlement?':'Undo this settlement mark?'))return;
    await deleteDoc(ref);
    showToast(s.status==='confirmed'?'Settlement reopened':'Settlement mark removed');
    settleRefresh(viewer);
  }catch(e){showToast('Error: '+e.message);console.error('unsettleMonth:',e);}
};

let _ownerEmail='',_ownerPass='';

// AUTH STATE
onAuthStateChanged(auth,async user=>{
  if(_suppressAuthChange)return;
  if(!user){CU=null;UP=null;CD=null;showScreen('auth');renderAuth();return;}
  CU=user;
  setMsg('Loading profile...');
  showScreen('loading');
  try{
    // Load user profile
    const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists()){
      showToast('Profile not found — contact manager',4000);
      await signOut(auth);return;
    }
    UP=snap.data();

    if(UP.role==='owner'){
      // Owner flow
      setMsg('Loading dashboard...');
      document.getElementById('osub').textContent=user.email;
      buildOTabs();
      showScreen('owner');
      try{await oSwitch('dash');}catch(re){console.error('Dashboard render error:',re);showToast('Dashboard load error — try refreshing',4000);}

    }else{
      // Driver flow
      setMsg('Loading driver profile...');
      let driverDoc=null;

      // Try direct lookup first (fast — new accounts have driverDocId stored)
      if(UP.driverDocId){
        try{
          const dSnap=await getDoc(doc(db,'drivers',UP.driverDocId));
          if(dSnap.exists()&&dSnap.data().active!==false) driverDoc={id:dSnap.id,...dSnap.data()};
        }catch(e2){console.warn('Direct driver lookup failed:',e2.message);}
      }

      // Fallback: query by userId (old accounts without driverDocId)
      if(!driverDoc){
        try{
          const dq=query(collection(db,'drivers'),where('userId','==',user.uid));
          const ds=await getDocs(dq);
          if(!ds.empty){
            const pick=ds.docs.find(d=>d.data().active!==false)||ds.docs[0];
            driverDoc={id:pick.id,...pick.data()};
          }
        }catch(qe){console.warn('Driver query failed:',qe.message);}
      }

      if(!driverDoc){
        showToast('Driver account not found — contact your manager',5000);
        await signOut(auth);return;
      }

      CD=driverDoc;
      showScreen('driver');
      try{await renderDHdr();}catch(he){console.warn('Header render error:',he);}
      try{await dRender('entry');}catch(de){console.error('Entry render error:',de);document.getElementById('dp-entry').innerHTML='<div style="padding:20px;color:var(--text2);text-align:center">Error loading entry. Please refresh.</div>';}
    }
  }catch(e){
    console.error('Auth load error:',e.code,e.message);
    _suppressAuthChange=false;
    showScreen('auth');
    renderAuth();
    showToast('Login error: '+e.message,5000);
  }
});

function salUI(type,p){p=p||{};

  if(type==='uber_pct')return`<div style="display:flex;flex-direction:column;gap:8px"><div class="field"><label>Uber Deduction %</label><input type="number" id="sp1" value="${p.uberDeduct||10}"></div><div class="field"><label>Salary %</label><input type="number" id="sp2" value="${p.pct||35}"></div></div>`;
  if(type==='flat_pct')return`<div class="field"><label>Salary %</label><input type="number" id="sp1" value="${p.pct||35}"></div>`;
  if(type==='custom')return`<div style="display:flex;flex-direction:column;gap:8px"><div class="field"><label>Transfer %</label><input type="number" id="sp1" value="${p.tPct||35}"></div><div class="field"><label>Uber Deduction %</label><input type="number" id="sp2" value="${p.uberDeduct||10}"></div><div class="field"><label>Uber Salary %</label><input type="number" id="sp3" value="${p.uPct||35}"></div></div>`;
  return'';
}

window.addDrv=async()=>{
  const name=(document.getElementById('ndn').value||'').trim();
  const email=(document.getElementById('nde').value||'').trim().toLowerCase();
  const pass=(document.getElementById('ndp').value||'').trim();
  const dayOff=+document.getElementById('nddo').value;
  const st=document.getElementById('ndst').value;
  const pct2=+document.getElementById('ndpct').value||35;
  const tgt=+document.getElementById('ndtgt').value||300;
  if(!name){showToast('Enter driver name');return;}
  if(!email){showToast('Enter driver email');return;}
  if(!pass||pass.length<6){showToast('Password must be at least 6 chars');return;}
  if(!_ownerPass){showToast('Please log out and log back in first');return;}

  const btn=document.getElementById('addbtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Creating...';}

  const ownerUid=CU.uid;
  const ownerEmail=_ownerEmail||CU.email; // declared outside try so catch can use it
  _suppressAuthChange=true;

  try{
    // 1. Create Firebase Auth account (signs in as driver temporarily)
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const driverUid=cred.user.uid;

    // 2. Write all docs while signed in as driver (driver can write own docs)
    await setDoc(doc(db,'users',driverUid),{
      name,email,role:'driver',ownerId:ownerUid,ownerCode:null,
      createdAt:new Date().toISOString()
    });
    const dRef=await addDoc(collection(db,'drivers'),{
      userId:driverUid,name,email,ownerId:ownerUid,active:true,
      salType:st,salParams:{pct:pct2},carId:null,
      dailyTarget:tgt,lockDays:0,reqApproval:false,dayOff,
      createdAt:new Date().toISOString()
    });
    // Save driverDocId so driver login uses fast getDoc not a query
    await updateDoc(doc(db,'users',driverUid),{driverDocId:dRef.id});

    // 3. Re-auth as owner silently
    const ownerCred=await signInWithEmailAndPassword(auth,ownerEmail,_ownerPass);
    CU=ownerCred.user;

    // 4. Restore owner UI
    _suppressAuthChange=false;
    closeModal();
    document.getElementById('osub').textContent=ownerEmail;
    buildOTabs();
    showScreen('owner');
    await oSwitch('drvs');

    // 5. Show success + WhatsApp
    setTimeout(()=>showModal(`<div class="mt">✅ Driver Created!</div>
      <div class="alert as2" style="margin-bottom:12px">🎉 <strong>${esc(name)}</strong> is ready. Send these details once — same login forever.</div>
      <div class="card" style="margin-bottom:10px"><div class="cb">
        ${rH('Name',esc(name))}
        ${rH('Email',esc(email))}
        <div class="row"><span class="rl">Password</span><span class="rv" style="color:var(--gold);font-size:15px;letter-spacing:2px;font-weight:800">${esc(pass)}</span></div>
      </div></div>
      <div class="alert ai" style="margin-bottom:10px">📱 Driver: open app → tap <strong>🚗 Driver</strong> → enter email & password.</div>
      <div style="display:flex;flex-direction:column;gap:7px">
      <button class="btn bg2 bfull" onclick="sendDrvWA('${esc(name)}','${esc(email)}','${esc(pass)}')">📱 Send via WhatsApp</button>
      <button class="btn bs bfull" onclick="closeModal()">Done</button></div>`),200);

  }catch(e){
    _suppressAuthChange=false;
    if(btn){btn.disabled=false;btn.textContent='✅ Create Driver & Send via WhatsApp';}
    showToast(e.code==='auth/email-already-in-use'?'Email already in use — try another':'Error: '+e.message);
    // Restore owner session
    try{
      const rc=await signInWithEmailAndPassword(auth,ownerEmail,_ownerPass);
      CU=rc.user;
      document.getElementById('osub').textContent=ownerEmail;
      buildOTabs();showScreen('owner');oSwitch('drvs').catch(()=>{});
    }catch(re){_ownerEmail='';_ownerPass='';await signOut(auth);}
  }
};

window.exportCSV=async()=>{
  const drivers=await getDrivers();let csv='Driver,Date,Paid,Cash,Uber,Total Income,Expenses,Gross Salary,Car Rent,Net Salary,Balance,Status\n';
  for(const d of drivers){
    const q=query(collection(db,'entries'),where('driverId','==',d.id),where('yearMonth','==',`${rY}-${pad(rM)}`));
    const s=await getDocs(q);
    // For CSV: use monthly salary ÷ days for per-row salary (correct for base_bonus)
    const tM=await calcMonth(d,rY,rM);const salPerDay=tM.days>0?tM.salary/tM.days:0;
    s.docs.forEach(e=>{const c=calcDay(e.data(),d.salType,d.salParams);const dailySal=salPerDay;const dailyExp=(+e.data().driverExp||0)+(+e.data().cashFuel||0)+(+e.data().expenses||0);const dailyNet=dailySal+(+e.data().tip||0)+dailyExp;csv+=`"${d.name}",${e.data().date},${c.pT},${c.cT},${c.uA},${c.income},${dailyExp.toFixed(2)},${dailySal.toFixed(2)},0,${dailyNet.toFixed(2)},,${e.data().status||'saved'}\n`;});
  }
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`RazaCars_${rY}_${rM}.csv`;a.click();URL.revokeObjectURL(url);showToast('CSV exported!');
};

const dCalc=c=>{

  const row=(label,val,col)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text2)">${label}</span><span style="font-size:13px;font-weight:700;font-family:monospace;color:${col||'var(--text)'}">${val}</span></div>`;

    ${row('💶 Uber cash',fA(c.uC)+' €','var(--text)')}

    ${c.adj!==0?row('⚖️ Adjustment',(c.adj>0?'+':'')+f2(c.adj),'var(--purple)'):''}
  </div>`;
};

  </div>`).join('')+`<div style="text-align:right;font-size:12px;font-weight:700;color:var(--green);padding-top:6px">Total transfers: €${tot%1===0?tot:tot.toFixed(2)}</div>`;

function trRefresh(){
  const el=document.getElementById('trlist');if(el)el.innerHTML=renderTrList();

function trTotals(){
  const trs=dEntry.transfers||[];
  dEntry.paidTrans=trs.filter(t=>t.payment==='paid').reduce((s,t)=>s+(+t.amount||0),0)||'';
  dEntry.cashTrans=trs.filter(t=>t.payment==='cash').reduce((s,t)=>s+(+t.amount||0),0)||'';
}
window.qTr=(label,amount,payment)=>{
  dEntry.transfers=[...Array.isArray(dEntry.transfers)?dEntry.transfers:[]];
  dEntry.transfers.push({label,amount:+amount,payment});
  trTotals();trRefresh();
};
window.cTr=(payment)=>{
  const dest=(document.getElementById('tr-dest')||{}).value?.trim();
  const amt=parseFloat((document.getElementById('tr-amt')||{}).value)||0;
  if(!dest||!amt){showToast('Enter destination and amount');return;}
  if(!Array.isArray(dEntry.transfers))dEntry.transfers=[];
  dEntry.transfers.push({label:dest,amount:amt,payment});
  const di=document.getElementById('tr-dest');const ai=document.getElementById('tr-amt');
  if(di)di.value='';if(ai)ai.value='';
  trTotals();trRefresh();
};
window.rmTr=(idx)=>{
  if(!Array.isArray(dEntry.transfers))return;
  dEntry.transfers.splice(idx,1);trTotals();trRefresh();
};

window.shareDay=()=>{
  const c=calcDay(dEntry,CD.salType,CD.salParams);
  const trs=dEntry.transfers||[];
  const p=dSel.split('-');
  const dateStr=`${p[2]}.${p[1]}.${p[0]}`;
  // fS = "272.90 €" (space before €), fN = "51.09€" (no space, used for card/expense)
  const fA=x=>{const v=+x||0;return v%1===0?`${Math.round(v)}`:`${v.toFixed(2)}`;};
  const fS=x=>`${fA(x)} €`;
  const fN=x=>`${fA(x)}€`;
  const trTotal=trs.length?trs.reduce((s,t)=>s+(+t.amount||0),0):(c.pT+c.cT);
  const trLines=trs.length
    ?trs.map(t=>`Transfer 1 ${t.label} @ ${fN(t.amount)} (${t.payment==='cash'?'cash 💵':'paid'})`).join('\n')
    :(c.pT>0||c.cT>0?`${c.pT>0?'Transfer paid: '+fN(c.pT):''}${c.cT>0?(c.pT>0?'\n':'')+'Transfer cash: '+fN(c.cT):''}` :'');
  const msg=`${dateStr}${trLines?'\n'+trLines:''}\nUber : ${fS(c.uA)} ( ${fN(trTotal)})\nTotal: ${fS(c.income)}\nCard cash : ${fN(c.cC)} 🫵🏻💰\nExpense : ${fN(c.driverExp)} 🫵🏻💰\nUber cash: ${fS(c.uC)}\nTip: ${fS(c.tip)}`;
  try{navigator.clipboard.writeText(msg);}catch(e){}
  window.location.href='whatsapp://send?text='+encodeURIComponent(msg);
};

window.shareAll=async()=>{
  showToast('Building month…');

};

async function renderHist(){
  const el=document.getElementById('dp-history');el.innerHTML='<div class="spin" style="margin:40px auto"></div>';
  try{
  const q=query(collection(db,'entries'),where('driverId','==',CD.id));
  const s=await getDocs(q);
  const entries=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date));
  // Monthly totals
  const months={};
  entries.forEach(e=>{
    const c=calcDay(e,CD.salType,CD.salParams);
    const ym=e.yearMonth||e.date.slice(0,7);
    if(!months[ym])months[ym]={income:0,cash:0,exp:0,netSal:0,days:0};
    months[ym].income+=c.income;months[ym].cash+=c.totalInHand;months[ym].exp+=c.driverExp;months[ym].netSal+=c.netSal;months[ym].days++;
  });
  // Summary strip
  let mStripH='';
  Object.keys(months).sort((a,b)=>b.localeCompare(a)).slice(0,3).forEach(ym=>{
    const [y,m]=ym.split('-');const mn=months[ym];
    mStripH+=`<div class="sc" style="min-width:0"><div class="sv" style="color:var(--green);font-size:13px">${f2(mn.income)}</div><div class="sl">${MNS[+m-1]} ${y} (${mn.days}d)</div>${mn.exp>0?`<div style="font-size:10px;color:var(--orange)">💸 Exp: ${f2(mn.exp)}</div>`:''}</div>`;
  });
  el.innerHTML=`<div style="font-size:15px;font-weight:700">My Entries (${entries.length})</div>`+
    (mStripH?`<div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:3px">${mStripH}</div>`:'')
    +(entries.length?entries.map(e=>{
      const c=calcDay(e,CD.salType,CD.salParams);const parts=e.date.split('-');const d=new Date(+parts[0],+parts[1]-1,+parts[2]);
      const sc=e.status==='approved'?'<span class="chip cg">✅</span>':e.status==='pending'?'<span class="chip co">⏳</span>':e.status==='rejected'?'<span class="chip cr">❌</span>':'';
      const expBadge=c.driverExp>0?`<span class="chip co" style="font-size:9px">💸 ${f2(c.driverExp)}</span>`:'';
      return`<div class="di" onclick="selDate('${e.date}');dTab('entry')"><div class="dav" style="background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93c5fd;font-size:12px;font-weight:700">${parts[2]}</div>
      <div class="din"><div class="dn">${e.date} ${sc}</div><div class="dm">${DOW[d.getDay()]} · 💵 ${f2(c.totalInHand)} in hand · 💳 ${f2(c.actualCash)} cash</div>${expBadge?`<div style="margin-top:2px">${expBadge}</div>`:''}</div>
      <div class="dst"><div class="v" style="color:var(--green)">${f2(c.income)}</div><div class="l" style="color:var(--text2)">Tr ${f2(c.transfers)}</div></div></div>`;
    }).join(''):'<div class="empty"><div class="ei">📋</div><div class="et">No entries yet</div><div class="es">Start adding your daily data</div></div>');
  }catch(e){el.innerHTML='<div class="alert ad">⚠️ Error loading history: '+esc(e.message)+'</div>';console.error('renderHist:',e);}
}

let svY=nowY(),svM=nowM();

  const t=await calcMonth(CD,svY,svM);const mBal=t?t.bal:0;const target=(CD.dailyTarget||300)*dim(svY,svM);
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:15px;font-weight:700">My Summary</div>
    <div style="display:flex;gap:5px"><button onclick="chgSvm(-1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px">‹</button>
    <button onclick="chgSvm(1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px">›</button></div></div>
    <div style="font-size:11px;color:var(--text2)">${MN[svM-1]} ${svY}</div>`+
    (t&&t.days>0?`<div class="sg">
      <div class="sc"><div class="sv" style="color:var(--green)">${f2(t.income)}</div><div class="sl">Total Income</div></div>
      <div class="sc"><div class="sv" style="color:var(--blue)">${f2(t.netSal)}</div><div class="sl">Net Salary</div></div>
      <div class="sc"><div class="sv" style="color:var(--gold)">${t.days}</div><div class="sl">Working Days</div></div>
      <div class="sc"><div class="sv" style="color:#14b8a6">${f2(t.days>0?t.income/t.days:0)}</div><div class="sl">Avg / Day</div></div>
      <div class="sc"><div class="sv" style="color:var(--gold)">${f2(t.totalInHand)}</div><div class="sl">💵 Cash In Hand</div></div>
      <div class="sc"><div class="sv" style="color:${t.driverExp>0?'var(--orange)':'var(--text3)'}">${f2(t.driverExp)}</div><div class="sl">💸 My Expenses</div></div></div>
    <div class="card"><div class="cb"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <span style="font-size:11px;color:var(--text2)">🎯 Monthly Target: ${f2(target)}</span>
      <span style="font-size:11px;font-weight:700;color:${t.income>=target?'var(--green)':'var(--text2)'}">${Math.min(100,(t.income/target)*100).toFixed(0)}%</span></div>
      <div class="pt"><div class="pf" style="width:${Math.min(100,(t.income/target)*100)}%;background:${t.income>=target?'linear-gradient(90deg,var(--green2),var(--green))':'linear-gradient(90deg,var(--blue2),var(--blue))'}"></div></div>
      ${t.income>=target?'<div style="font-size:10px;color:var(--green);margin-top:3px;font-weight:700">🎉 Monthly target reached!</div>':''}</div></div>
    <div class="card"><div class="ch" style="color:#93c5fd">Income</div><div class="cb">${rH('Paid',f2(t.pT))+rH('Cash Trans',f2(t.cT))+rH('Uber App',f2(t.uA))+rH('Total',f2(t.income),'green big')}</div></div>
    <div class="card"><div class="ch" style="color:#34d399">Cash Flow</div><div class="cb">${rH('Physical Cash',f2(t.phys))+rH('Less: Card Cash','-'+f2(t.cC),'red')+(t.driverExp>0?rH('💸 Driver Expenses','+'+f2(t.driverExp),'orange'):'')+rH('Actual Cash',f2(t.actualCash),'big')}</div></div>
    <div class="card"><div class="ch" style="color:#a78bfa">Salary Breakdown</div><div class="cb">${rH('Gross Salary',f2(t.salary))+(t.tip>0?rH('🎁 Tips','+'+f2(t.tip),'green'):'')+(t.driverExp>0?rH('💸 Expenses (return)','+'+f2(t.driverExp),'green'):'')+rH('Net Salary',f2(t.netSal),'big')}</div></div>
    <div class="bal ${mBal<0?'owe':'give'}"><div><div class="bl2" style="color:${mBal<0?'#34d399':'#fb923c'}">${mBal<0?'✅ Company owes you':'⚠️ You owe company'}</div><div class="bsub">Month balance</div></div><div class="bamt" style="color:${mBal<0?'#34d399':'#fb923c'}">${abs2(mBal)}</div></div>
    <button class="btn bg2 bfull" onclick="shareMonth()">📱 Share Monthly</button>

    :'<div class="empty"><div class="ei">📊</div><div class="et">No data this month</div></div>');
  }catch(e){el.innerHTML='<div class="alert ad">⚠️ Error loading summary: '+esc(e.message)+'</div>';console.error('renderSum:',e);}

window.chgSvm=d=>{svM+=d;if(svM>12){svM=1;svY++;}if(svM<1){svM=12;svY--;}renderSum();};
window.shareMonth=async()=>{
  const t=await calcMonth(CD,svY,svM);if(!t)return;const debt=await getDebt(CD);
  const msg=`📊 MONTHLY — ${MN[svM-1]} ${svY}\n🚗 Raza Cars\n━━━━━━━━━━━━\nTotal Income: ${f2(t.income)}\nGross Salary: ${f2(t.salary)}${t.tip>0?'\n🎁 Tips: +'+f2(t.tip):''}${t.driverExp>0?'\n💸 Expenses (return): +'+f2(t.driverExp):''}\nNet Salary: ${f2(t.netSal)}\nActual Cash: ${f2(t.actualCash)}\nDays: ${t.days} · Avg: ${f2(t.days>0?t.income/t.days:0)}\n━━━━━━━━━━━━\n${debt<0?'✅ Co.owes: '+abs2(debt):'⚠️ You owe: '+abs2(debt)}`;
  window.location.href='whatsapp://send?text='+encodeURIComponent(msg);
};

// Compile EVERY day of the selected month into one detailed message for the owner
window.sendMonthToOwner=async()=>{
  try{
    const ym=`${svY}-${pad(svM)}`;
    const q=query(collection(db,'entries'),where('driverId','==',CD.id),where('yearMonth','==',ym));
    const s=await getDocs(q);
    const entries=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date.localeCompare(b.date));
    if(!entries.length){showToast('No entries to send this month');return;}
    const fA=x=>{const v=+x||0;return v%1===0?`${Math.round(v)}`:`${v.toFixed(2)}`;};
    const fS=x=>`${fA(x)} €`;const fN=x=>`${fA(x)}€`;
    let TpT=0,TcT=0,TuA=0,TuC=0,TcC=0,Ttip=0,Texp=0,Tinc=0,Tcash=0;
    let body='';
    entries.forEach(e=>{
      const c=calcDay(e,CD.salType,CD.salParams);
      const p=e.date.split('-');
      TpT+=c.pT;TcT+=c.cT;TuA+=c.uA;TuC+=c.uC;TcC+=c.cC;Ttip+=c.tip;Texp+=c.driverExp;Tinc+=c.income;Tcash+=c.actualCash;
      const trs=e.transfers||[];
      const trTotal=trs.length?trs.reduce((s,t)=>s+(+t.amount||0),0):c.pT+c.cT;
      const trLines=trs.length?trs.map(t=>`Transfer 1 ${t.label} @ ${fN(t.amount)} (${t.payment==='cash'?'cash 💵':'paid'})`).join('\n')
        :(c.pT>0||c.cT>0?`${c.pT>0?'Transfer paid: '+fN(c.pT):''}${c.cT>0?(c.pT>0?'\n':'')+'Transfer cash: '+fN(c.cT):''}` :'');
      body+=`\n${p[2]}.${p[1]}.${p[0]}\n`;
      if(trLines)body+=trLines+'\n';
      body+=`Uber : ${fS(c.uA)} ( ${fN(trTotal)})\nTotal: ${fS(c.income)}\nCard cash : ${fN(c.cC)} 🫵🏻💰\nExpense : ${fN(c.driverExp)} 🫵🏻💰\nUber cash: ${fS(c.uC)}\nTip: ${fS(c.tip)}\n`;
    });
    const msg=`📋 *${MN[svM-1]} ${svY} — Full Month*\n🚗 Raza Cars · ${CD.name||'Driver'}\n━━━━━━━━━━━━━━${body}━━━━━━━━━━━━━━\n📊 *TOTALS — ${entries.length} day${entries.length!==1?'s':''}*\nTransfers: ${fS(TpT+TcT)} (paid: ${fN(TpT)} · cash: ${fN(TcT)})\nUber App: ${fS(TuA)}\nUber Cash: ${fS(TuC)}\nCard Cash: ${fN(TcC)}\nExpense: ${fN(Texp)}${Ttip>0?'\nTips: '+fS(Ttip):''}\n*TOTAL INCOME: ${fS(Tinc)}*\nActual Cash: ${fS(Tcash)}`;
    try{await navigator.clipboard.writeText(msg);showToast('📋 Copied — opening WhatsApp (paste if needed)',3500);}catch(e){showToast('Opening WhatsApp…');}
    window.location.href='whatsapp://send?text='+encodeURIComponent(msg);
  }catch(e){showToast('Error: '+e.message);console.error('sendMonthToOwner:',e);}
};

async function renderBal(){
  const el=document.getElementById('dp-balance');el.innerHTML='<div class="spin" style="margin:40px auto"></div>';
  try{
    const y=nowY(),m=nowM(),currentYM=`${y}-${pad(m)}`;
    const setts=await getDriverSettlements(CD.id);
    const settledSet=new Set(Object.keys(setts));
    const isCurrentSettled=settledSet.has(currentYM);
    const aq=query(collection(db,'advances'),where('driverId','==',CD.id));
    const as=await getDocs(aq);const myAdv=as.docs.map(d=>({id:d.id,...d.data()}));
    const advDebt=myAdv.filter(a=>!a.repaid).reduce((s,a)=>s+(+a.amount||0),0);
    const totalDebt=await getDebt(CD);
    const monthsTotal=totalDebt-advDebt;
    const curT=await calcMonth(CD,y,m);
    const currentBal=(!isCurrentSettled&&curT&&curT.days>0)?curT.bal:0;
    const prevBal=monthsTotal-currentBal;
    const monthRows=[];
    for(let i=0;i<6;i++){let mm=m-i,yy=y;if(mm<1){mm+=12;yy--;}const t=await calcMonth(CD,yy,mm);if(t&&t.days>0)monthRows.push({label:`${MNS[mm-1]} ${yy}`,ym:`${yy}-${pad(mm)}`,bal:t.bal,days:t.days,inc:t.income});}
    const settleLog=Object.values(setts).sort((a,b)=>(b.initiatedAt||'').localeCompare(a.initiatedAt||''));
    const bCol=v=>v<0?'#34d399':'#fb923c';
    const bLbl=v=>v<0?'Co.owes':'You owe';
    const roleName=r=>r==='owner'?'Owner':'Driver';
    const yl=ym=>{const p=(ym||'').split('-');return p.length===2?`${MNS[+p[1]-1]} ${p[0]}`:ym;};
    el.innerHTML=`<div style="font-size:15px;font-weight:700">My Balance</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px">
        <div style="background:var(--bg3);border:1.5px solid ${currentBal===0?'var(--border)':bCol(currentBal)+'55'};border-radius:13px;padding:12px">
          <div style="font-size:10px;color:var(--text2);margin-bottom:5px">📅 This Month</div>
          <div style="font-size:20px;font-weight:800;font-family:monospace;color:${currentBal===0?'var(--text3)':bCol(currentBal)}">${abs2(currentBal)}</div>
          <div style="font-size:9px;color:${currentBal===0?'var(--text3)':bCol(currentBal)};margin-top:3px">${currentBal===0?'Settled':bLbl(currentBal)}</div>
        </div>
        <div style="background:var(--bg3);border:1.5px solid ${prevBal===0?'var(--border)':bCol(prevBal)+'55'};border-radius:13px;padding:12px">
          <div style="font-size:10px;color:var(--text2);margin-bottom:5px">📆 Previous</div>
          <div style="font-size:20px;font-weight:800;font-family:monospace;color:${prevBal===0?'var(--text3)':bCol(prevBal)}">${abs2(prevBal)}</div>
          <div style="font-size:9px;color:${prevBal===0?'var(--text3)':bCol(prevBal)};margin-top:3px">${prevBal===0?'All settled':bLbl(prevBal)}</div>
        </div>
      </div>
      <div class="bal ${totalDebt<0?'owe':'give'}" style="margin-bottom:10px">
        <div><div class="bl2" style="color:${bCol(totalDebt)};font-size:14px">${totalDebt<0?'✅ Company owes you':'⚠️ You owe company'}</div><div class="bsub">Total${advDebt>0?' · advances '+f2(advDebt):''}</div></div>
        <div class="bamt" style="color:${bCol(totalDebt)};font-size:24px">${abs2(totalDebt)}</div>
      </div>
      ${myAdv.length?`<div class="card"><div class="ch" style="color:var(--orange)">💸 Advances</div><div class="cb">${myAdv.map(a=>`<div class="row"><div><div style="font-size:11px">${esc(a.note||'Advance')}</div><div style="font-size:9px;color:var(--text2)">${a.date}</div></div><div><span class="rv" style="color:${a.repaid?'var(--text3)':'var(--orange)'}">${f2(a.amount)}</span> ${a.repaid?'<span class="chip cg">Repaid</span>':'<span class="chip co">Owed</span>'}</div></div>`).join('')}</div></div>`:''}
      <div class="card"><div class="ch" style="color:var(--blue)">📅 Month by Month · Settlement</div><div class="cb" style="gap:8px">${monthRows.length?monthRows.map(r=>`<div style="background:var(--bg4);border:1px solid var(--border);border-radius:11px;padding:10px 12px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700">${r.label}</span><span style="font-size:10px;color:var(--text2)">${r.days} day${r.days!==1?'s':''}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><span style="font-size:10px;color:var(--text2)">Income ${f2(r.inc)}</span><span style="font-family:monospace;font-weight:800;font-size:14px;color:${bCol(r.bal)}">${bLbl(r.bal)} ${abs2(r.bal)}</span></div>
        ${settleZoneHTML(setts[r.ym],CD.id,r.ym,'driver',r.bal)}

  }catch(e){el.innerHTML='<div class="alert ad">⚠️ Error: '+esc(e.message)+'</div>';console.error('renderBal:',e);}
}
