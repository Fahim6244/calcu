<script>

const SALARY_BASE=1600,THRESHOLD=6000,BONUS=0.40,TARGET=7500;
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const BLANK={paidTrans:"",cashTrans:"",uberApp:"",uberCash:"",cardCash:"",expenses:"",tip:"",adjustment:"",km:"",notes:""};
const LOCAL_KEY="fahim_v3";
let appData={entries:{},settings:{}};
let mi=0,selDate=null,overrideDay=null,entry={...BLANK};
let billedTo=null,currentTab="entry",saved=false,cloudStatus="local";
let pinDigits=[],pinMode="lock",pinSetupFirst="";
let editingUberStart=false,syncTimer=null,currentScreen="loading";
const dim=(y,m)=>new Date(y,m,0).getDate();
const dow=(y,m,d)=>new Date(y,m-1,d).getDay();
const isTue=(y,m,d)=>dow(y,m,d)===2;
function lastSun(y,m){for(let d=dim(y,m);d>=1;d--)if(dow(y,m,d)===0)return d;return dim(y,m);}
const f2=n=>`€${Number(n||0).toFixed(2)}`;
const abs2=n=>`€${Math.abs(Number(n||0)).toFixed(2)}`;
const pct=(a,b)=>b?`${((a/b)*100).toFixed(1)}%`:"0.0%";
const mkKey=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function mc(){return MONTHS[mi];}
function mk(){return mkKey(mc().year,mc().m);}
function mDays(){return dim(mc().year,mc().m);}
function settings(){return appData.settings||{};}
function mEnt(){return(appData.entries||{})[mk()]||{};}
function uberStart(){const s=settings();const us=s.uberStarts||{};return us[mk()]!==undefined?us[mk()]:mc().uberStart;}
function uberEnd(){const oa=mc().overflowAfter;return oa&&oa.length>0?mDays():lastSun(mc().year,mc().m);}
const isUberDay=(d,us,ue)=>d>=us&&d<=ue;
function getEntryKey(sd,mc2){if(!sd)return null;if(sd.isOverflow)return sd.m<mc2.m?`p${sd.d}`:`n${sd.d}`;return sd.d;}
function calcDay(e){
const pT=+e.paidTrans||0,cT=+e.cashTrans||0,uA=+e.uberApp||0;
const uC=+e.uberCash||0,cC=+e.cardCash||0,ex=+e.expenses||0,tip=+e.tip||0,adj=+e.adjustment||0;
const income=pT+cT+uA;
const salary=income<=THRESHOLD?SALARY_BASE:SALARY_BASE+BONUS*(income-THRESHOLD);
const salaryWithTips=salary+tip;
const phys=uC+cT;const net=phys-ex;
const actualCash=phys-cC-ex;const totalInHands=phys+tip;
const bal=(actualCash-salaryWithTips)-adj;
return{pT,cT,uA,uC,cC,ex,tip,adj,income,salary,salaryWithTips,phys,net,actualCash,totalInHands,bal};}
function calcMonthBilled(targetMk,allEntries){
const z={pT:0,cT:0,uA:0,uC:0,cC:0,ex:0,tip:0,adj:0,income:0,phys:0,net:0,actualCash:0,totalInHands:0};
return Object.entries(allEntries||{}).reduce((tot,[mk2,monthEnt])=>{
if(!monthEnt||typeof monthEnt!=="object")return tot;
return Object.values(monthEnt).reduce((t,e)=>{
if(!e||typeof e!=="object")return t;
const bill=e.billedTo||mk2;if(bill!==targetMk)return t;
const c=calcDay(e);
return{pT:t.pT+c.pT,cT:t.cT+c.cT,uA:t.uA+c.uA,uC:t.uC+c.uC,cC:t.cC+c.cC,ex:t.ex+c.ex,tip:t.tip+c.tip,adj:t.adj+c.adj,income:t.income+c.income,phys:t.phys+c.phys,net:t.net+c.net,actualCash:t.actualCash+c.actualCash,totalInHands:t.totalInHands+c.totalInHands};
},tot);},z);}
function persist(nd){appData=nd;try{localStorage.setItem(LOCAL_KEY,JSON.stringify(nd));}catch{}const cfg=nd.settings||{};if(cfg.binId&&cfg.binKey){if(syncTimer)clearTimeout(syncTimer);setCloudStatus("syncing");syncTimer=setTimeout(function(){cloudSave(cfg.binId,cfg.binKey,nd).then(function(){setCloudStatus("synced");}).catch(function(){setCloudStatus("error");});},2500);}}

async function autoCreateBin(){const cfg=settings();if(!cfg.binKey){showToast("⚠️ Enter API key first");return;}try{showToast("Creating…");const id=await cloudCreate(cfg.binKey,appData);const nd={...appData,settings:{...settings(),binId:id}};persist(nd);showToast("✅ Cloud created!");renderSettings();}catch(e){showToast("❌ "+e.message);}}

function drawBarChart(id,data){const canvas=document.getElementById(id);if(!canvas)return;const dpr=window.devicePixelRatio||1;const W=canvas.offsetWidth,H=120;canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const maxV=Math.max(...data.map(d=>Math.max(d.income,d.expenses)),1);const pad={l:30,r:4,t:4,b:20};const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;ctx.clearRect(0,0,W,H);ctx.font="8px -apple-system,Arial,sans-serif";ctx.fillStyle="#94a3b8";[0,.5,1].forEach(f=>{const y=pad.t+ch*(1-f);ctx.fillText((maxV*f).toFixed(0),0,y+3);ctx.strokeStyle="rgba(71,85,105,.3)";ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});const bw=Math.max(2,(cw/data.length)*0.4);data.forEach((d,i)=>{const x=pad.l+(i/(data.length-1||1))*cw;if(d.income>0){const h=(d.income/maxV)*ch;ctx.fillStyle="#3b82f6";ctx.beginPath();ctx.roundRect(x-bw,pad.t+ch-h,bw,h,2);ctx.fill();}if(d.expenses>0){const h=(d.expenses/maxV)*ch;ctx.fillStyle="#ef4444";ctx.beginPath();ctx.roundRect(x,pad.t+ch-h,bw,h,2);ctx.fill();}});ctx.fillStyle="#94a3b8";data.forEach((d,i)=>{if(i%5===0||i===data.length-1){const x=pad.l+(i/(data.length-1||1))*cw;ctx.fillText(d.day,x-4,H-4);}});}
function drawLineChart(id,data){const canvas=document.getElementById(id);if(!canvas)return;const dpr=window.devicePixelRatio||1;const W=canvas.offsetWidth,H=120;canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const maxV=Math.max(...data.map(d=>Math.max(d.total,d.target)),1);const pad={l:30,r:4,t:4,b:20};const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;ctx.clearRect(0,0,W,H);ctx.font="8px -apple-system,Arial,sans-serif";ctx.fillStyle="#94a3b8";[0,.5,1].forEach(f=>{const y=pad.t+ch*(1-f);ctx.fillText((maxV*f).toFixed(0),0,y+3);ctx.strokeStyle="rgba(71,85,105,.3)";ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});const ptX=(i)=>pad.l+(i/(data.length-1||1))*cw;const ptY=(v)=>pad.t+ch*(1-v/maxV);ctx.strokeStyle="#f59e0b";ctx.lineWidth=1;ctx.setLineDash([4,2]);ctx.beginPath();data.forEach((d,i)=>{i===0?ctx.moveTo(ptX(i),ptY(d.target)):ctx.lineTo(ptX(i),ptY(d.target));});ctx.stroke();ctx.strokeStyle="#10b981";ctx.lineWidth=2;ctx.setLineDash([]);ctx.beginPath();data.forEach((d,i)=>{i===0?ctx.moveTo(ptX(i),ptY(d.total)):ctx.lineTo(ptX(i),ptY(d.total));});ctx.stroke();ctx.fillStyle="#94a3b8";data.forEach((d,i)=>{if(i%5===0||i===data.length-1){ctx.fillText(d.day,ptX(i)-4,H-4);}});}
function drawPieChart(id,data){const canvas=document.getElementById(id);if(!canvas)return;const dpr=window.devicePixelRatio||1;canvas.width=110*dpr;canvas.height=110*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const cx=55,cy=55,R=50,r=30;const total=data.reduce((s,d)=>s+d.value,0);let angle=-Math.PI/2;ctx.clearRect(0,0,110,110);data.forEach(d=>{const slice=(d.value/total)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,angle,angle+slice);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();angle+=slice;});ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle="#1e293b";ctx.fill();}
function renderSettings(){const s=settings();const uberStarts=s.uberStarts||{};const totalKm=Object.values(mEnt()).filter(e=>typeof e==="object").reduce((a,e)=>a+(+e.km||0),0);let html=`<h2 style="color:white;font-weight:bold;font-size:18px;margin:0">Settings</h2><div class="settings-section"><h3>🚗 Uber Start Days</h3>${MONTHS.map((mc2)=>{const aMk=mkKey(mc2.year,mc2.m);const cur=uberStarts[aMk]!==undefined?uberStarts[aMk]:mc2.uberStart;return`<div class="settings-row"><span>${mc2.label}</span><span style="color:${uberStarts[aMk]!==undefined?"#4ade80":"#64748b"}">Day ${cur}</span></div>`;}).join("")}<button onclick="resetUberStarts()" style="margin-top:10px;width:100%;padding:10px 0;border-radius:12px;font-weight:bold;font-size:13px;border:1px solid #334155;background:transparent;color:#64748b;cursor:pointer">Reset All to Default</button></div><div class="settings-section"><h3>☁️ Cloud Sync</h3><p class="sub">jsonbin.io (free). Get Master Key → paste below.</p><p style="color:#94a3b8;font-size:11px;margin:0 0 4px">API Master Key</p><input type="password" placeholder="$2a$10$..." value="${esc(s.binKey||"")}" oninput="updateSetting('binKey',this.value)" class="settings-input"><p style="color:#94a3b8;font-size:11px;margin:0 0 4px">Bin ID</p><input type="text" placeholder="auto-generated" value="${esc(s.binId||"")}" oninput="updateSetting('binId',this.value)" class="settings-input">${!s.binId&&s.binKey?`<button onclick="autoCreateBin()" style="width:100%;padding:12px 0;border-radius:12px;font-weight:bold;font-size:14px;border:none;cursor:pointer;background:#2563eb;color:white;margin-bottom:8px">✨ Create Cloud Storage</button>`:""} ${s.binId&&s.binKey?`<div style="display:flex;gap:8px;margin-bottom:8px"><button onclick="manualCloudSync()" style="flex:1;padding:12px 0;border-radius:12px;font-weight:bold;font-size:13px;border:none;cursor:pointer;background:#16a34a;color:white">☁️ Save</button><button onclick="loadFromCloud()" style="flex:1;padding:12px 0;border-radius:12px;font-weight:bold;font-size:13px;border:none;cursor:pointer;background:#2563eb;color:white">⬇️ Load</button></div>`:""}<div style="padding:8px 12px;border-radius:10px;background:${cloudStatus==="synced"?"rgba(20,83,45,.3)":cloudStatus==="error"?"rgba(153,27,27,.3)":"rgba(51,65,85,.3)"};text-align:center;font-size:12px;color:${cloudStatus==="synced"?"#4ade80":cloudStatus==="error"?"#fca5a5":"#64748b"}">${cloudStatus==="synced"?"✅ Synced":cloudStatus==="syncing"?"🔄 Syncing…":cloudStatus==="error"?"❌ Failed":"💾 Not connected"}</div></div>`;
if(totalKm>0){const mT=calcMonthBilled(mk(),appData.entries||{});html+=`<div class="settings-section"><h3>🚗 KM Stats — ${mc().label}</h3>${rowHTML("Total KM",`${totalKm.toFixed(0)} km`)}${rowHTML("Total Expenses",f2(mT.ex))}${rowHTML("Avg cost/km",`€${(mT.ex/totalKm).toFixed(2)}/km`,"big")}</div>`;}
html+=`<div class="settings-section"><h3>🔐 PIN Lock</h3><p class="sub">${s.pin?"✅ PIN set.":"No PIN."}</p><button onclick="showScreen('setup')" style="width:100%;padding:12px 0;border-radius:12px;font-weight:bold;font-size:14px;border:none;cursor:pointer;background:#2563eb;color:white;margin-bottom:8px">${s.pin?"🔄 Change PIN":"🔐 Set PIN"}</button>${s.pin?`<button onclick="removePin()" style="width:100%;padding:12px 0;border-radius:12px;font-weight:bold;font-size:14px;border:none;cursor:pointer;background:rgba(153,27,27,.4);color:#fca5a5">🗑 Remove PIN</button>`:""}</div>`;
html+=`<div class="settings-section"><h3>💾 Backup</h3><button onclick="backupData()" style="width:100%;padding:12px 0;border-radius:12px;font-weight:bold;font-size:14px;border:none;cursor:pointer;background:#334155;color:white;margin-bottom:8px">⬇️ Download Backup (.json)</button><label style="display:block;width:100%;padding:12px 0;border-radius:12px;font-weight:bold;font-size:14px;background:rgba(51,65,85,.5);color:#94a3b8;text-align:center;cursor:pointer;box-sizing:border-box">⬆️ Restore from Backup<input type="file" accept=".json" onchange="restoreFile(this)" style="display:none"></label></div>`;
html+=`<div class="settings-section"><h3>💼 Salary Rules</h3>${rowHTML("Fixed salary (≤ €6,000)","€1,600")}${rowHTML("Bonus above €6,000","40%")}${rowHTML("Monthly target","€7,500")}${rowHTML("Apr: March 30+31 + May 1-3","Overflow","muted")}${rowHTML("May Uber starts","Day 4","muted")}</div>`;
document.getElementById("panel-settings").innerHTML=html;}
function updateSetting(key,val){const s=settings();const nd={...appData,settings:{...s,[key]:val}};appData=nd;try{localStorage.setItem(LOCAL_KEY,JSON.stringify(nd));}catch{}}
function resetUberStarts(){const nd={...appData,settings:{...settings(),uberStarts:{}}};persist(nd);showToast("Reset to defaults");renderSettings();}
function removePin(){const nd={...appData,settings:{...settings(),pin:""}};persist(nd);try{localStorage.setItem("fahim_pin","");}catch{}showToast("🔓 Removed");renderSettings();}
function renderAll(){renderHeader();if(currentTab==="entry")renderEntry();else if(currentTab==="history")renderHistory();else if(currentTab==="charts")renderCharts();else if(currentTab==="settings")renderSettings();}
function init(){showScreen("loading");try{const l=localStorage.getItem(LOCAL_KEY);if(l)appData=JSON.parse(l);}catch{}const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,cd=now.getDate();const idx=MONTHS.findIndex(x=>x.year===cy&&x.m===cm);if(idx>=0)mi=idx;const mc2=MONTHS[mi];selDate={year:mc2.year,m:mc2.m,d:cd<=mDays()&&cy===mc2.year&&cm===mc2.m?cd:mc2.uberStart,isOverflow:false};loadEntryForSel();let hasPinLock=false;try{const p=localStorage.getItem("fahim_pin");hasPinLock=!!(p&&p.length===4&&settings().pin);}catch{}if(hasPinLock){showScreen("lock");}else{showScreen("main");renderAll();}}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{setTimeout(init,0);}
</script></body></html>
